<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>봉사활동 확인서 발급</title>
<style>
  :root{
    --navy:#16233F; --navy-2:#1E2F52; --mint:#2E9E77; --mint-2:#268A67;
    --paper:#EFEFEF; --line:#DAD2BC; --ink:#22262E; --ink-soft:#6B7280; --seal:#C0392B; --gold:#B8862E;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  .app{
    font-family:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Noto Sans KR',-apple-system,sans-serif;
    color:var(--ink); background:var(--paper); min-height:100vh;
  }

  .topbar{
    background:var(--navy); color:#fff; padding:16px 20px; display:flex; align-items:center;
    justify-content:space-between; flex-wrap:wrap; gap:10px;
  }
  .topbar h1{font-size:16px; margin:0; font-family:'Batang','바탕',serif;}
  .topbar .sub{font-size:11.5px; color:#9AA6C4; margin-top:2px;}

  .role-bar{max-width:760px; margin:16px auto 0; padding:0 16px; display:flex; gap:8px;}
  .role-opt{
    flex:1; padding:9px 4px; border-radius:8px; font-size:12.5px; font-weight:700; cursor:pointer;
    border:1px solid var(--line); background:#fff; color:var(--ink-soft); text-align:center;
  }
  .role-opt.on{background:var(--mint); color:#fff; border-color:var(--mint);}
  body.role-student .exclude-x{display:none;}
  body.role-student .exclude-reason-input{pointer-events:none; background:#F5F5F5; color:var(--ink-soft);}

  .search-bar{
    max-width:760px; margin:20px auto 0; padding:0 16px; display:flex; gap:8px;
  }
  .search-bar input{
    flex:1; padding:11px 14px; border:1px solid var(--line); border-radius:8px; font-size:14px;
  }
  .search-bar button{
    padding:11px 18px; border:none; border-radius:8px; background:var(--navy); color:#fff;
    font-weight:700; font-size:13.5px; cursor:pointer;
  }
  .search-hint{max-width:760px; margin:8px auto 0; padding:0 16px; font-size:11.5px; color:var(--ink-soft);}

  .results{max-width:760px; margin:16px auto; padding:0 16px;}
  .result-card{
    background:#fff; border:1px solid var(--line); border-radius:10px; padding:13px 16px;
    margin-bottom:10px; cursor:pointer;
  }
  .result-card:hover{background:#F5F6F8;}
  .result-top{display:flex; justify-content:space-between; gap:8px; align-items:baseline;}
  .result-title{font-weight:700; font-size:14.5px;}
  .result-badge{font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:10px; white-space:nowrap;}
  .badge-issued{background:#E4F3EC; color:var(--mint-2);}
  .badge-pending{background:#FBF0DE; color:var(--gold);}
  .result-prog{font-size:12px; margin-top:6px; color:var(--ink-soft);}
  body.role-student .result-prog{display:none;}
  .result-meta{font-size:12px; color:var(--ink-soft); margin-top:5px;}
  .empty-state{text-align:center; padding:40px 16px; color:var(--ink-soft); font-size:13px;}

  .doc-view-toggle{
    max-width:760px; margin:0 auto 10px; padding:0 16px; display:flex; gap:8px;
  }
  .view-toggle-opt{
    padding:9px 18px; border-radius:7px; font-size:12.5px; font-weight:700; cursor:pointer;
    border:1px solid var(--line); background:#fff; color:var(--ink-soft);
  }
  .view-toggle-opt.on{background:var(--navy); color:#fff; border-color:var(--navy);}
  .doc-actions{
    max-width:760px; margin:0 auto 10px; padding:0 16px; display:flex; gap:8px; justify-content:flex-end;
  }
  .doc-actions button{
    padding:9px 16px; border-radius:7px; font-size:12.5px; font-weight:700; cursor:pointer; border:1px solid var(--line);
    background:#fff; color:var(--navy);
  }
  .doc-actions button.primary{background:var(--mint); color:#fff; border-color:var(--mint);}
  .doc-actions button:disabled{opacity:.4; cursor:not-allowed;}
  .back-link{max-width:760px; margin:16px auto 0; padding:0 16px;}
  .back-link button{
    background:none; border:none; color:var(--ink-soft); font-size:12.5px; cursor:pointer; text-decoration:underline;
  }

  .sheet{
    background:#fff; max-width:760px; margin:16px auto; padding:34px 38px 30px;
    box-shadow:0 4px 18px rgba(20,25,40,.12); border:1px solid #DADFE8;
  }
  .sheet-note{font-size:11px; text-align:center; color:var(--ink-soft); margin-bottom:6px;}
  .sheet-h1{
    text-align:center; font-family:'Batang','바탕',serif; font-weight:700; font-size:23px;
    letter-spacing:.3em; padding-left:.3em; margin-bottom:22px;
  }

  .approval-wrap{display:flex; justify-content:flex-end; margin-bottom:14px;}
  table.approval-box{border-collapse:collapse; font-size:9.5px; table-layout:fixed; width:200px;}
  table.approval-box td{border:1px solid #333; text-align:center;}
  table.approval-box col.approval-corner-col{width:14px;}
  table.approval-box col.approval-data-col{width:62px;}
  table.approval-box .approval-head{padding:3px 2px; white-space:nowrap;}
  table.approval-box .approval-body{padding:26px 2px; height:52px;}
  table.approval-box .approval-corner{font-weight:700; font-size:9.5px; writing-mode:vertical-rl; letter-spacing:.05em; padding:3px 1px;}

  table.doc{width:100%; border-collapse:collapse; font-size:12.5px;}
  table.doc td, table.doc th{border:1px solid #333; padding:7px 9px; vertical-align:middle;}
  td.rowno{width:26px; text-align:center; font-weight:700; background:#F4F4F4; font-size:12px;}
  td.rowlabel{width:132px; font-weight:700; background:#F4F4F4; font-size:11.5px; line-height:1.35;}
  td.rowval{ }
  .fixed-text{color:#444; font-size:12.5px;}

  .students-tbl{width:100%; border-collapse:collapse; font-size:12px; table-layout:fixed;}
  .students-tbl th{background:#F7F7F5; border:1px solid #333; padding:2px 1px; font-size:10px; white-space:nowrap; line-height:1.1;}
  .students-tbl td{border:1px solid #333; padding:0; text-align:center; vertical-align:middle;}
  .confirm-tbl td{padding:3px 2px;}
  .students-tbl .idx{background:#FAFAF8; color:var(--ink-soft) !important; font-size:11.5px; white-space:nowrap;}
  .students-tbl a, table.doc a{color:inherit !important; text-decoration:none !important; pointer-events:none;}

  .total-row td{border:1px solid #333;}
  .total-row .total-label{font-weight:700; text-align:center; background:#F7F7F5;}
  .total-row .total-value{font-weight:700; text-align:center;}

  .exclude-x{
    border:none; background:none; color:#B0473C; font-size:11px; font-weight:700; cursor:pointer;
    margin-left:3px; padding:0 2px; line-height:1; vertical-align:middle;
  }
  .restore-x{color:var(--mint); font-size:13px; margin-left:0; margin-right:2px;}
  .add-panel{margin-top:10px; border:1px solid #B9D3C6; background:#F2F8F4; border-radius:6px; padding:10px 12px;}
  .add-panel-title{font-size:11.5px; font-weight:700; color:var(--mint); margin-bottom:6px;}
  .add-warn{background:#FFF4D6; border:2px solid #E0A100; border-radius:7px; padding:9px 12px; margin-bottom:9px; font-size:12.5px; line-height:1.6; color:#5C3B00; font-weight:700;}
  .add-warn .add-warn-head{color:#B0473C; font-size:13px; margin-bottom:2px;}
  .add-panel-row{display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
  .add-panel-row input{border:1px solid #B9D3C6; border-radius:5px; padding:6px 8px; font-size:12px; font-family:inherit; background:#fff;}
  #addSid{width:90px;} #addName{width:120px;}
  .add-panel-row button{border:none; background:var(--mint); color:#fff; font-size:12px; font-weight:700; padding:7px 14px; border-radius:6px; cursor:pointer;}
  .add-panel-note{font-size:10.5px; color:var(--ink-soft); margin-top:6px; line-height:1.5;}
  .add-tag{display:inline-block; font-size:9px; font-weight:800; color:#fff; background:var(--mint); border-radius:6px; padding:0 4px; margin-left:3px; vertical-align:middle;}
  .exclude-panel{margin-top:10px; border:1px solid #E3B7B0; background:#FBF3F2; border-radius:6px; padding:10px 12px;}
  .exclude-panel-title{font-size:11.5px; font-weight:700; color:#B0473C; margin-bottom:6px;}
  .exclude-panel-row{display:flex; align-items:center; gap:8px; margin-bottom:6px; font-size:11.5px;}
  .exclude-panel-row:last-child{margin-bottom:0;}
  .exclude-panel-name{width:120px; flex-shrink:0; color:var(--ink);}
  .exclude-reason-input{
    flex:1; border:1px solid #E3B7B0; border-radius:5px; padding:5px 8px; font-size:11.5px;
    font-family:inherit; background:#fff;
  }

  .statement{text-align:center; font-size:12.5px; line-height:2; margin:26px 0 6px;}
  .sign-row{display:flex; justify-content:center; align-items:center; gap:6px; font-size:12.5px; margin-bottom:22px;}
  .approve-block{text-align:center; margin-top:10px; position:relative;}
  .approve-title{font-size:14px; font-weight:700; letter-spacing:.25em; padding-left:.25em; margin-top:8px; position:relative; display:inline-block;}
  .seal{position:absolute; right:-64px; top:-16px; width:64px; height:64px; opacity:.92;}
  .seal img{width:100%; height:100%; object-fit:contain; display:block;}

  .toast{
    position:fixed; top:18px; left:50%; transform:translateX(-50%) translateY(-12px);
    background:var(--ink); color:#fff; padding:11px 20px; border-radius:8px; font-size:13.5px;
    font-weight:600; box-shadow:0 6px 20px rgba(0,0,0,.25); z-index:200;
    opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast.success{background:var(--mint);}
  .toast.error{background:var(--seal);}

  @page{ size: A4; margin: 10mm; }
  @media print{
    .topbar, .role-bar, .search-bar, .search-hint, .results, .doc-view-toggle, .doc-actions, .back-link, .add-panel, .add-tag{display:none !important;}
    .app{background:#fff;}
    .sheet{box-shadow:none; border:none; margin:0; max-width:none; padding:14mm 16mm 12mm; font-size:12.5px;}
    .sheet-note{font-size:11px; margin-bottom:8px;}
    .sheet-h1{font-size:24px; margin-bottom:18px;}
    table.doc{font-size:12.5px;}
    table.doc td, table.doc th{padding:6px 9px;}
    td.rowlabel{font-size:11.5px; line-height:1.3;}
    .fixed-text{font-size:12px;}
    .students-tbl{font-size:12px; table-layout:fixed;}
    .students-tbl th{font-size:11.5px; padding:4px 2px;}
    .students-tbl .idx{font-size:11.5px;}
    .exclude-x{display:none;}
    .exclude-panel{border-color:#333; background:#fff;}
    .exclude-reason-input{border:none; padding:2px 0; background:transparent;}
    .statement{margin:16px 0 8px; font-size:12.5px; line-height:1.9;}
    .sign-row{margin-bottom:10px; font-size:12.5px;}
    .approve-block{margin-top:14px !important;}
    .approve-title{font-size:14px;}
    .seal{width:54px; height:54px; right:-54px; top:-12px;}
  }
  .ex-wrap{max-width:820px; margin:0 auto;}
  .ex-eyebrow{font-size:11px; color:var(--ink-soft); letter-spacing:.06em;}
  .ex-title{font-size:20px; font-weight:800; color:var(--navy); margin:2px 0 14px;}
  .ex-crumb{display:flex; gap:6px; flex-wrap:wrap; font-size:11.5px; margin-bottom:14px;}
  .ex-crumb span{padding:4px 10px; border-radius:12px; background:#E3E7EF; color:#6B7280; font-weight:700;}
  .ex-crumb span.on{background:var(--navy); color:#fff;}
  .ex-crumb span.done{background:#CFEBDD; color:#1F7A58;}
  .ex-card{background:#fff; border:1px solid #DADFE8; border-radius:10px; padding:16px 18px; margin-bottom:12px; box-shadow:0 2px 8px rgba(20,25,40,.05);}
  .ex-card h3{margin:0 0 8px; font-size:14.5px; color:var(--navy);}
  .ex-note{font-size:12px; color:var(--ink-soft); line-height:1.55;}
  .ex-warn{font-size:12px; color:#B5651D; background:#FFF5E6; border:1px solid #F0D6AE; border-radius:7px; padding:8px 10px; margin-bottom:10px;}
  .ex-err{font-size:12px; color:var(--seal); margin:8px 0;}
  .ex-row{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .ex-input, .ex-ta{
    width:100%; border:1px solid #C9D0DE; border-radius:7px; padding:8px 10px; font-size:13px; background:#fff; color:var(--ink);
  }
  .ex-ta{min-height:92px; resize:vertical; line-height:1.55;}
  .ex-input:disabled, .ex-ta:disabled{background:#F2F4F8; color:#555;}
  .ex-btn{border:none; border-radius:7px; padding:9px 16px; font-size:12.5px; font-weight:700; cursor:pointer; background:var(--navy); color:#fff;}
  .ex-btn.mint{background:var(--mint);}
  .ex-btn.ghost{background:#E3E7EF; color:var(--navy);}
  .ex-btn.danger{background:#fff; color:var(--seal); border:1px solid #E5B7B1;}
  .ex-btn:disabled{opacity:.5; cursor:not-allowed;}
  .ex-item{display:block; width:100%; text-align:left; background:#fff; border:1px solid #DADFE8; border-radius:9px; padding:11px 13px; margin-bottom:8px; cursor:pointer;}
  .ex-item:hover{border-color:var(--mint);}
  .ex-item b{font-size:13.5px; color:var(--navy);}
  .ex-item .sub{font-size:11.5px; color:var(--ink-soft); margin-top:3px;}
  .ex-chip{display:inline-block; font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:9px; margin-left:6px; vertical-align:middle;}
  .ex-chip.ok{background:#CFEBDD; color:#1F7A58;}
  .ex-chip.wait{background:#FBEBC6; color:#9A6B00;}
  .ex-chip.none{background:#E3E7EF; color:#6B7280;}
  .ex-radio{display:flex; gap:10px; margin:6px 0 10px; flex-wrap:wrap;}
  .ex-radio label{flex:1; min-width:220px; border:1.5px solid #C9D0DE; border-radius:9px; padding:11px 13px; cursor:pointer; font-size:12.5px; background:#fff;}
  .ex-radio label.on{border-color:var(--mint); background:#EEF8F3;}
  .ex-radio label b{display:block; font-size:13.5px; color:var(--navy); margin-bottom:2px;}
  .ex-members{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:4px 10px; margin:6px 0;}
  .ex-members label{font-size:12.5px; display:flex; gap:6px; align-items:center;}
  .ex-doc-title{text-align:center; font-family:'Batang','바탕','Noto Serif KR',serif; font-weight:700; font-size:18px; margin-bottom:14px;}
  .ex-label{font-size:12.5px; font-weight:700; color:var(--navy); margin:12px 0 5px;}
  .ex-tbl{width:100%; border-collapse:collapse; font-size:12px; margin:4px 0;}
  .ex-tbl td, .ex-tbl th{border:1px solid #888; padding:4px 8px; text-align:center;}
  .ex-tbl th{background:#F1F3F7;}
  .hx-tbl{width:100%; border-collapse:collapse; font-size:11.5px; margin:6px 0;}
  .hx-tbl td, .hx-tbl th{border:1px solid #bbb; padding:4px 6px; text-align:left; vertical-align:top;}
  .hx-tbl th{background:#F1F3F7; text-align:center; white-space:nowrap;}
  .hx-tbl .hx-warn{color:var(--seal); font-weight:700;}
  .hx-tbl .hx-sum{color:#666; margin-top:2px;}
  .hx-wrap{overflow-x:auto;}
  .ex-entry{border:1px solid #C9D0DE; border-radius:10px; padding:13px 15px; margin-bottom:12px; background:#FCFCFE;}
  .ex-entry.confirmed{background:#F4FAF7; border-color:#9BD2B8;}
  .ex-entry-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-weight:800; color:var(--navy); font-size:13.5px;}
  .ex-grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .ex-ro{white-space:pre-wrap; font-size:13px; line-height:1.6; background:#F7F8FB; border-radius:7px; padding:8px 10px; min-height:34px;}
  .ex-photos{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px;}
  .ex-ph{position:relative; width:96px; height:96px; border-radius:8px; overflow:hidden; border:1px solid #C9D0DE; background:#EEF0F5;}
  .ex-ph img{width:100%; height:100%; object-fit:cover; cursor:zoom-in;}
  .ex-ph-x{position:absolute; top:2px; right:2px; width:20px; height:20px; border:none; border-radius:50%; background:rgba(0,0,0,.6); color:#fff; font-size:13px; line-height:1; cursor:pointer;}
  .ex-add-photo{display:inline-flex; align-items:center; justify-content:center; width:96px; height:96px; border:1.5px dashed #9AA6C4; border-radius:8px; color:#6B7280; font-size:12px; cursor:pointer; text-align:center; background:#fff;}
  .ex-confirmbar{margin-top:10px; padding-top:9px; border-top:1px dashed #C9D0DE; display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; font-size:12.5px;}
  .ex-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px;}
  .ex-lightbox{position:fixed; inset:0; background:rgba(0,0,0,.8); display:flex; align-items:center; justify-content:center; z-index:9999; cursor:zoom-out;}
  .ex-lightbox img{max-width:92vw; max-height:92vh; border-radius:6px;}
  .ex-wrap{max-width:none;}
  .log-panel{max-width:820px; margin:0 auto; padding:0 16px 40px;}

  .login-gate{position:fixed; inset:0; background:var(--navy); color:#fff; z-index:100; display:flex; align-items:center; justify-content:center; padding:20px;}
  .login-card{background:#fff; color:var(--ink); width:100%; max-width:360px; border-radius:14px; padding:28px 26px; box-shadow:0 12px 40px rgba(0,0,0,.35);}
  .login-eyebrow{font-size:11px; letter-spacing:.1em; color:var(--ink-soft); text-align:center;}
  .login-title{font-size:17px; font-weight:700; text-align:center; margin:4px 0 20px;}
  .login-field-label{font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:5px; display:block;}
  .login-input{width:100%; border:1px solid var(--line); border-radius:8px; padding:11px 12px; font-size:14px; margin-bottom:6px;}
  .login-hint{font-size:11px; color:var(--ink-soft); margin-bottom:16px; line-height:1.5;}
  .login-btn{width:100%; padding:12px; border:none; border-radius:9px; background:var(--mint); color:#fff; font-size:14.5px; font-weight:700; cursor:pointer;}
  .login-err{font-size:12px; color:var(--seal); margin-bottom:10px; display:none;}
  .login-disclaimer{font-size:10.5px; color:#9AA6C4; text-align:center; margin-top:16px; line-height:1.5;}
  .topbar .who{font-size:11.5px; color:#DCE3F0;}
  .logout-link{background:none; border:none; color:#9AA6C4; font-size:11px; cursor:pointer; text-decoration:underline; margin-left:8px;}
  .role-opt{flex:1;}
  .result-card.tp-proj{border-left:5px solid #B5453A;}
  .result-card.tp-sel{border-left:5px solid #4E8F34;}
  .tp-chip{display:inline-block; font-size:10.5px; font-weight:800; padding:2px 9px; border-radius:9px; margin-right:6px; vertical-align:middle;}
  .tp-chip.proj{background:#F6DEDA; color:#8A2A1F;}
  .tp-chip.sel{background:#DCEBD3; color:#2F6B1A;}
  body.menu-plans .doc-view-toggle, body.menu-plans #issueBtn, body.menu-plans .result-prog{display:none !important;}
  body:not(.menu-plans) #printBtn{display:none !important;} /* 확인·발급 메뉴는 [전송 및 인쇄] 하나로, 계획서 조회 메뉴는 [인쇄]만 */

  /* ---- 보고서 상세 보기 ---- */
  .rp-hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%); color:#fff; border-radius:14px; padding:20px 22px 18px; margin-bottom:14px; box-shadow:0 4px 14px rgba(22,35,63,.18);}
  .rp-hero-top{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px;}
  .rp-badge{font-size:11px; font-weight:800; letter-spacing:.06em; background:rgba(255,255,255,.14); border-radius:10px; padding:3px 10px;}
  .rp-hero .ex-chip{margin-left:0; font-size:11px; padding:3px 10px;}
  .rp-title{font-size:19px; font-weight:800; line-height:1.35; margin:2px 0 4px; font-family:'Batang','바탕','Noto Serif KR',serif;}
  .rp-act{font-size:13.5px; color:#BFE9D8; font-weight:700; margin-bottom:14px;}
  .rp-meta{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px;}
  .rp-meta div{background:rgba(255,255,255,.1); border-radius:9px; padding:8px 11px;}
  .rp-meta span{display:block; font-size:10.5px; color:#B9C4DC; margin-bottom:2px;}
  .rp-meta b{font-size:13px; font-weight:700;}
  .rp-sec{background:#fff; border:1px solid #DADFE8; border-radius:12px; padding:14px 18px 16px; margin-bottom:12px; box-shadow:0 1px 3px rgba(20,25,40,.05);}
  .rp-sec-h{display:flex; align-items:center; gap:9px; font-size:14.5px; font-weight:800; color:var(--navy); padding-bottom:9px; margin-bottom:11px; border-bottom:2px solid #E4EAF3;}
  .rp-num{display:inline-flex; width:24px; height:24px; border-radius:50%; background:var(--mint); color:#fff; font-size:12.5px; align-items:center; justify-content:center; flex-shrink:0;}
  .rp-text{white-space:pre-wrap; word-break:break-word; font-size:14px; line-height:1.9; color:#1F2430; background:#F8FAFC; border-left:4px solid var(--mint); border-radius:0 9px 9px 0; padding:13px 16px;}
  .rp-text.empty{color:#9AA3B2; border-left-color:#C9D0DE;}
  .rp-students{display:flex; flex-wrap:wrap; gap:7px;}
  .rp-st{background:#EEF3FA; border:1px solid #D3DDEC; border-radius:18px; padding:5px 12px; font-size:12.5px; color:var(--navy);}
  .rp-st small{color:#6B7A93; margin-right:4px;}
  .rp-st.abs{background:#FBEDEB; border-color:#EBC3BE; color:#8A2A1F;}
  .rp-st.abs em{font-style:normal; font-size:10.5px; font-weight:800; background:#B5453A; color:#fff; border-radius:8px; padding:1px 6px; margin-left:5px;}
  .rp-absnote{margin-top:10px; font-size:12px; color:#8A2A1F; background:#FBF3F2; border:1px solid #EBC3BE; border-radius:8px; padding:8px 12px; line-height:1.7;}
  .rp-gallery{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px; margin-top:12px;}
  .rp-gallery .ex-photos{display:contents;}
  .rp-gallery .ex-ph{width:100%; height:170px; border-radius:10px; border:1px solid #D3DDEC;}
  .rp-gallery .ex-note{grid-column:1/-1;}
  .rp-photo-h{font-size:12px; font-weight:700; color:#6B7A93; margin-top:14px;}
  .rp-confirm{border-radius:12px; padding:14px 18px; margin-bottom:12px; border:1.5px solid #F0D6AE; background:#FFF8EA;}
  .rp-confirm.done{border-color:#9BD2B8; background:#F1FAF5;}
  .rp-confirm-h{font-size:14px; font-weight:800; color:#8A5A00; margin-bottom:4px;}
  .rp-confirm.done .rp-confirm-h{color:#1F7A58;}
  .rp-confirm .ex-note{margin-bottom:10px;}
  .rp-by{font-size:12.5px; color:#35524A; margin-bottom:10px;}

  /* ---- 활동일지 상세 보기 ---- */
  .rp-hero.lg{background:linear-gradient(135deg,#1B4D3E 0%,#256B55 100%);}
  .lg-entry{background:#fff; border:1px solid #D3DDEC; border-radius:14px; margin-bottom:16px; overflow:hidden; box-shadow:0 2px 6px rgba(20,25,40,.07);}
  .lg-entry.confirmed{border-color:#9BD2B8;}
  .lg-entry-head{display:flex; align-items:center; gap:11px; background:#16233F; color:#fff; padding:11px 18px;}
  .lg-entry.confirmed .lg-entry-head{background:#1F7A58;}
  .lg-no{width:30px; height:30px; border-radius:50%; background:#fff; color:#16233F; font-weight:900; font-size:15px; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;}
  .lg-entry.confirmed .lg-no{color:#1F7A58;}
  .lg-entry-title{font-size:15.5px; font-weight:800; flex:1;}
  .lg-entry-head .ex-chip{margin-left:0; font-size:11px; padding:3px 10px;}
  .lg-body{padding:16px 18px 14px;}
  .lg-meta{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:14px;}
  .lg-meta > div{background:#F1F5FA; border:1px solid #D9E2EF; border-radius:10px; padding:8px 12px;}
  .lg-meta .wide{grid-column:1/-1;}
  .lg-meta span.k{display:block; font-size:10.5px; font-weight:700; color:#6B7A93; letter-spacing:.04em; margin-bottom:2px;}
  .lg-meta b{font-size:13.5px; color:var(--navy);}
  .lg-meta .rp-students{gap:5px; margin-top:3px;}
  .lg-meta .rp-st{background:#fff; padding:3px 10px; font-size:12px;}
  .lg-lb{display:flex; align-items:center; gap:7px; font-size:13px; font-weight:800; color:var(--navy); margin:14px 0 6px;}
  .lg-lb::before{content:''; width:5px; height:15px; border-radius:3px; background:var(--mint);}
  .lg-lb.alt::before{background:var(--gold);}
  .lg-lb.photo::before{background:#6A8BC9;}
  .rp-text.alt{background:#FFFBF2; border-left-color:var(--gold);}
  .lg-body .rp-gallery{margin-top:4px;}
  .lg-confirm{margin:14px -18px -14px; padding:10px 18px; background:#F1FAF5; border-top:1px solid #CFE7DB; display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; font-size:12.5px; color:#1F6B4E; font-weight:700;}
  .lg-confirm.wait{background:#FFF8EA; border-top-color:#F0D6AE; color:#8A5A00;}
  @media (max-width:560px){ .lg-meta{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div class="login-gate" id="loginGate">
  <div class="login-card">
    <div class="login-eyebrow">충남외국어고등학교 · 교내 봉사활동</div>
    <div class="login-title">교사 확인·확인서 발급</div>
    <label class="login-field-label">나이스 아이디</label>
    <input type="text" class="login-input" id="loginId" placeholder="나이스 아이디" autocomplete="off">
    <label class="login-field-label" style="margin-top:8px;">성명</label>
    <input type="text" class="login-input" id="loginName" placeholder="본인 성명" autocomplete="off">
    <div class="login-hint">계획서에 지도교사로 적힌 이름과 같은 봉사활동만 보여요.</div>
    <div class="login-err" id="loginErr"></div>
    <button class="login-btn" id="loginBtn">시작하기</button>
    <div class="login-disclaimer">※ 실제 나이스 계정과 연동된 인증은 아니며, 입력한 이름으로 본인이 지도하는 봉사활동을 구분하는 용도입니다.</div>
  </div>
</div>
<div class="app" id="app" style="display:none;">
  <div class="topbar">
    <div>
      <h1>봉사활동 교사 확인·확인서 발급</h1>
      <div class="sub">2026학년도 2학기 · 충남외국어고등학교</div>
    </div>
    <div class="who"><span id="userBadgeText"></span><button class="logout-link" id="logoutBtn">로그아웃</button></div>
  </div>

  <div class="role-bar">
    <button id="menuManageBtn" class="role-opt on">내 봉사활동 확인·발급</button>
    <button id="menuPlansBtn" class="role-opt">제출된 계획서 조회</button>
  </div>

  <div class="search-bar">
    <input type="text" id="teacherInput" placeholder="내 봉사활동 안에서 검색 (활동명, 작성자, 참가학생 이름 등)">
    <button id="searchBtn">조회</button>
  </div>
  <div class="search-hint"><span id="menuHint"></span></div>

  <div class="results" id="results"></div>

  <div id="docView" style="display:none;">
    <div class="back-link"><button id="backBtn">← 목록으로</button></div>
    <div class="doc-view-toggle">
      <button id="viewConfirmBtn" class="view-toggle-opt on">확인서로 보기</button>
      <button id="viewLogBtn" class="view-toggle-opt">활동일지 확인</button>
      <button id="viewPlanBtn" class="view-toggle-opt">계획서로 보기</button>
    </div>
    <div class="doc-actions">
      <button id="issueBtn" class="primary">전송 및 인쇄</button>
      <button id="pdfBtn">PDF 저장</button>
      <button id="printBtn">인쇄</button>
    </div>
    <div class="sheet" id="sheet"></div>
    <div class="log-panel" id="logPanel" style="display:none;"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
  var SHEET_SYNC_URL_FIXED = 'https://script.google.com/macros/s/AKfycbwVo6giYVzEfT75pIRYuLe2CZY-RzqZD5IgJQ1mGA2O2bhqisoJNjj1SJMKiLdiMt8/exec';

  var current = null; // { id, type, title, teacher, area, content, students:[{sid,name,excluded,excludeReason}] }

  function esc(s){
    return String(s==null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  var toastTimer = null;
  function showToast(msg, kind){
    var toastEl = document.getElementById('toast');
    if(!toastEl) return;
    toastEl.textContent = msg;
    toastEl.className = 'toast show' + (kind ? ' '+kind : '');
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.className = 'toast'; }, 2400);
  }

  function nameFontSize(len){
    if(len<=5) return 12;
    if(len===6) return 10.5;
    return 9;
  }

  // ---------- 로그인 · 지도교사 매칭 ----------
  var currentUser = null;
  var menuMode = 'manage'; // 'manage' 확인·발급 | 'plans' 계획서 조회
  var mineList = [];
  var allList = null; // 계획서 조회 메뉴용 전체 목록(처음 열 때 불러옴)

  function normName(x){ return String(x||'').replace(/\s+/g,''); }
  // 지도교사 칸에 "정윤희", "정윤희, 김철수", "정윤희(일본어)", "정윤희 선생님" 등으로 적힌 경우를 모두 인식
  function teacherMatches(field, name){
    var n = normName(name); if(!n) return false;
    var parts = String(field||'').replace(/\([^)]*\)/g,' ').split(/[,，\/·、;&+\n]+/);
    return parts.some(function(p){
      var raw = normName(p);
      return raw === n || raw.replace(/(선생님|교사|샘|T)$/,'') === n;
    });
  }

  function setMenuUI(){
    document.body.classList.toggle('menu-plans', menuMode==='plans');
    document.getElementById('menuManageBtn').classList.toggle('on', menuMode==='manage');
    document.getElementById('menuPlansBtn').classList.toggle('on', menuMode==='plans');
    document.getElementById('teacherInput').placeholder = menuMode==='manage'
      ? '내 봉사활동 안에서 검색 (활동명, 작성자, 참가학생 이름 등)'
      : '전체 계획서에서 검색 (활동명, 지도교사, 작성자, 참가학생 이름 등)';
    document.getElementById('menuHint').textContent = menuMode==='manage'
      ? '내가 지도교사인 봉사활동만 보여요. 선택하면 학생 보고서·활동일지를 확인하고 확인서를 발급할 수 있어요.'
      : '지도교사와 관계없이 제출된 모든 봉사활동의 계획서를 조회·인쇄할 수 있어요. 내용은 수정할 수 없어요.';
  }
  document.getElementById('menuManageBtn').onclick = function(){ menuMode='manage'; setMenuUI(); backToList(); };
  document.getElementById('menuPlansBtn').onclick = function(){ menuMode='plans'; setMenuUI(); backToList(); if(allList===null) loadAll(); };
  function backToList(){
    document.getElementById('docView').style.display = 'none';
    document.getElementById('results').style.display = '';
    renderMine();
  }

  function doLogin(id, name, persist){
    var err = document.getElementById('loginErr');
    id = (id||'').trim(); name = (name||'').replace(/\s+/g,''); // 이름 속 공백은 지움(확인자 기록이 같은 이름으로 남도록)
    if(id.length < 2){ err.textContent = '나이스 아이디를 입력해주세요.'; err.style.display='block'; return; }
    if(!name){ err.textContent = '성명을 입력해주세요.'; err.style.display='block'; return; }
    err.style.display = 'none';
    currentUser = { id:id, name:name };
    try{
      localStorage.setItem('cne-confirm-teacher', name); // 교사 확인 시 확인자 이름 자동 입력
      if(persist) localStorage.setItem('cne-confirm-login', JSON.stringify(currentUser));
    }catch(e){}
    document.getElementById('userBadgeText').textContent = '교사 · '+name+' · '+id;
    document.getElementById('loginGate').style.display = 'none';
    document.getElementById('app').style.display = '';
    setMenuUI();
    loadMine();
  }
  document.getElementById('loginBtn').onclick = function(){ doLogin(document.getElementById('loginId').value, document.getElementById('loginName').value, true); };
  ['loginId','loginName'].forEach(function(i){ document.getElementById(i).onkeydown = function(e){ if(e.key==='Enter') document.getElementById('loginBtn').click(); }; });
  document.getElementById('logoutBtn').onclick = function(){
    try{ localStorage.removeItem('cne-confirm-login'); }catch(e){}
    currentUser = null; mineList = []; allList = null; current = null; logState = null;
    document.getElementById('docView').style.display = 'none';
    document.getElementById('results').innerHTML = '';
    document.getElementById('teacherInput').value = '';
    document.getElementById('app').style.display = 'none';
    document.getElementById('loginGate').style.display = '';
  };

  // ---------- 검색(내 봉사활동 안에서) ----------
  document.getElementById('searchBtn').onclick = function(){ renderMine(); };
  document.getElementById('teacherInput').onkeydown = function(e){ if(e.key==='Enter') renderMine(); };

  function matchesQuery(r, q){
    var hay = [r.title, r.teacher, r.content, r.students, r.submitterName, r.area].join(' ').toLowerCase();
    return hay.indexOf(String(q).trim().toLowerCase()) !== -1;
  }

  function loadMine(){
    if(!currentUser) return;
    var resultsEl = document.getElementById('results');
    resultsEl.style.display = '';
    resultsEl.innerHTML = '<div class="empty-state">내 봉사활동을 불러오는 중…</div>';
    document.getElementById('docView').style.display = 'none';
    var me = currentUser.name;
    var summaryP = fetch(SHEET_SYNC_URL_FIXED + '?execSummary=1').then(function(r){ return r.json(); })
      .then(function(d){ return (d && d.plans) || null; }).catch(function(){ return null; });
    fetch(SHEET_SYNC_URL_FIXED + '?teacher=' + encodeURIComponent(me))
      .then(function(res){ return res.json(); })
      .then(function(data){ return summaryP.then(function(sum){
        execSummary = sum;
        // 서버가 예전 버전이어도 화면에서 한 번 더, 지도교사가 본인인 것만 남긴다.
        mineList = (data.results || []).filter(function(r){ return teacherMatches(r.teacher, me); });
        renderMine();
      }); })
      .catch(function(){
        resultsEl.innerHTML = '<div class="empty-state">조회 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.</div>';
      });
  }
  function renderMine(){
    if(!currentUser) return;
    var q = document.getElementById('teacherInput').value.trim();
    var base = menuMode==='plans' ? allList : mineList;
    if(base===null){ document.getElementById('results').innerHTML = '<div class="empty-state">계획서를 불러오는 중…</div>'; return; }
    var list = q ? base.filter(function(r){ return matchesQuery(r, q); }) : base;
    renderResults(list, base.length===0);
  }
  function loadAll(){
    document.getElementById('results').innerHTML = '<div class="empty-state">제출된 계획서를 불러오는 중…</div>';
    fetch(SHEET_SYNC_URL_FIXED + '?all=1').then(function(r){ return r.json(); }).then(function(d){
      allList = d.results || [];
      if(menuMode==='plans') renderMine();
    }).catch(function(){
      allList = null;
      if(menuMode==='plans') document.getElementById('results').innerHTML = '<div class="empty-state">조회 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.</div>';
    });
  }

  var execSummary = null;
  function progLine(r){
    if(!execSummary) return '';
    var p = execSummary[r.id] || {report:false, logs:0, absent:0};
    return '<div class="result-prog">보고서 '+(p.report?(p.reportConfirmed?'제출·확인 완료':'제출·<b>확인 대기</b>'):'<b>미제출</b>')+' · 활동일지 '+(p.logs ? p.logs+'건' : '<b>미제출</b>')+(p.absent ? ' · 활동 안 함 '+p.absent+'명' : '')+'</div>';
  }
  function renderResults(results, noneAtAll){
    var resultsEl = document.getElementById('results');
    if(results.length===0){
      resultsEl.innerHTML = noneAtAll
        ? (menuMode==='plans' ? '<div class="empty-state">조회된 계획서가 없어요.<br>Apps Script를 최신 버전(v18)으로 배포했는지 확인해주세요.</div>' : '<div class="empty-state">지도교사로 등록된 봉사활동이 없어요.<br>계획서의 지도교사 이름과 로그인할 때 입력한 이름이 같은지 확인해주세요.</div>')
        : '<div class="empty-state">검색어와 맞는 봉사활동이 없습니다.</div>';
      return;
    }
    var html = '';
    results.forEach(function(r, i){
      var issued = (r.finalDocStatus||'').indexOf('확인서')>=0;
      var isProj = (r.type||'').indexOf('프로젝트')>=0;
      html += '<div class="result-card '+(isProj?'tp-proj':'tp-sel')+'" data-idx="'+i+'">';
      html += '<div class="result-top"><span class="result-title"><span class="tp-chip '+(isProj?'proj':'sel')+'">'+(isProj?'프로젝트형':'선발형')+'</span>'+esc(r.title||'(제목 없음)')+'</span>';
      html += '<span class="result-badge '+(issued?'badge-issued':'badge-pending')+'">'+(issued?'발급완료':'발급대기')+'</span></div>';
      html += '<div class="result-meta">작성자 '+esc(r.submitterName||'-')+' · 지도교사 '+esc(r.teacher||'')+' · '+esc(r.type||'')+' · '+esc(r.area||'')+'</div>';
      html += progLine(r);
      html += '</div>';
    });
    resultsEl.innerHTML = html;
    resultsEl.querySelectorAll('[data-idx]').forEach(function(el){
      el.onclick = function(){ openRecord(results[+el.getAttribute('data-idx')]); };
    });
  }

  function parseStudentsText(text){
    return (text||'').split(',').map(function(s){ return s.trim(); }).filter(Boolean).map(function(entry){
      var sp = entry.indexOf(' ');
      if(sp===-1) return {sid:entry, name:''};
      return {sid: entry.slice(0,sp).trim(), name: entry.slice(sp+1).trim()};
    });
  }

  function parseExcludedText(text){
    var map = {};
    (text||'').split(',').map(function(s){return s.trim();}).filter(Boolean).forEach(function(entry){
      var parts = entry.split(':');
      if(parts.length>=2){
        map[parts[0].trim()] = { reason: parts.slice(2).join(':').trim() };
      }
    });
    return map;
  }

  var viewMode = 'plan'; // 'plan' | 'confirm'

  function openRecord(r){
    var studentsRaw = parseStudentsText(r.students);
    var excludedMap = parseExcludedText(r.excluded);
    var addedSids = {};
    parseStudentsText(r.added).forEach(function(s){ addedSids[s.sid] = true; });
    var students = studentsRaw.map(function(s){
      var ex = excludedMap[s.sid];
      return { sid:s.sid, name:s.name, excluded: !!ex, excludeReason: ex ? ex.reason : '', added: !!addedSids[s.sid] };
    });
    current = {
      id: r.id, type: r.type, title: r.title, teacher: r.teacher, area: r.area,
      content: r.content, motive: r.motive || '', submitterName: r.submitterName || '', students: students
    };
    viewMode = (menuMode==='plans') ? 'plan' : 'confirm'; // 확인·발급 메뉴는 확인서가 맨 먼저, 계획서 조회 메뉴는 계획서
    setViewButtons();
    logState = null;
    setMenuUI();
    document.getElementById('results').style.display = 'none';
    document.getElementById('docView').style.display = '';
    renderSheet();
  }

  function setViewButtons(){
    document.getElementById('viewPlanBtn').classList.toggle('on', viewMode==='plan');
    document.getElementById('viewConfirmBtn').classList.toggle('on', viewMode==='confirm');
    document.getElementById('viewLogBtn').classList.toggle('on', viewMode==='log');
    var isLog = viewMode==='log';
    document.getElementById('sheet').style.display = isLog ? 'none' : '';
    document.querySelector('.doc-actions').style.display = isLog ? 'none' : '';
    document.getElementById('logPanel').style.display = isLog ? '' : 'none';
  }
  document.getElementById('viewPlanBtn').onclick = function(){ viewMode = 'plan'; setViewButtons(); renderSheet(); };
  document.getElementById('viewConfirmBtn').onclick = function(){ viewMode = 'confirm'; setViewButtons(); renderSheet(); };
  document.getElementById('viewLogBtn').onclick = function(){ viewMode = 'log'; setViewButtons(); logLoad(); };

  document.getElementById('backBtn').onclick = function(){ backToList(); };

  function buildReadOnlyStudentsTable(){
    var COLS = 3;
    var active = [];
    var excludedList = [];
    current.students.forEach(function(s, idx){
      if(!(s.sid.trim() || s.name.trim())) return;
      if(s.excluded){
        excludedList.push({idx:idx, sid:s.sid, name:s.name, reason:s.excludeReason||''});
      } else {
        active.push({idx:idx, sid:s.sid, name:s.name, added:!!s.added});
      }
    });

  function lgStatusCard(S){
    var hasReport = S.reports.length>0;
    var studs = ((current && current.students) || []).filter(function(s){ return !s.excluded; });
    var rows = studs.map(function(s){
      var mine = lgStudentLogs(S, s);
      var real = [], ab = null;
      mine.forEach(function(l){
        if(l.absent){ ab = ab || {absentReason:l.absentReason}; return; }
        var am = (l.absentMembers||[]).filter(function(a){ return (a.sid && a.sid===s.sid) || (!a.sid && a.name===s.name); })[0];
        if(am) ab = ab || {absentReason:am.reason}; else real.push(l);
      });
      if(!real.length && !ab){
        var ra = (S.reports[0] && S.reports[0].absentMembers || []).filter(function(a){ return (a.sid && a.sid===s.sid) || (!a.sid && a.name===s.name); })[0];
        if(ra) ab = {absentReason:ra.reason, fromReport:true};
      }
      return {s:s, real:real, ab: real.length ? null : ab};
    });
    var nLog = rows.filter(function(r){ return r.real.length; }).length;
    var nAb = rows.filter(function(r){ return r.ab; }).length;
    var nNone = rows.length - nLog - nAb;

      + '<div class="ex-note" style="color:var(--navy);font-weight:700;">활동일지 제출 '+nLog+'명 · 활동 안 함 '+nAb+'명 · 미제출 '+nNone+'명</div>'

  function rpRequest(action, doneFn, okMsg, failMsg, askMsg){
    var key = logState.detailKey.slice(2);

    if(!confirm(askMsg)) return;
    fetch(SHEET_SYNC_URL_FIXED, {
      method:'POST', mode:'no-cors', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:action, planId:current.id, unitKey:key, confirmer:name })
    }).then(function(){
      logState.busy = true; logRender();
      var tries = 0;
      function poll(){
        return new Promise(function(r){ setTimeout(r, 2200); }).then(function(){
          return fetch(SHEET_SYNC_URL_FIXED + '?exec=' + encodeURIComponent(current.id)).then(function(r){ return r.json(); });
        }).then(function(d){
          logState.server = {reports:d.reports||[], logs:d.logs||[]};
          var r2 = logState.server.reports.filter(function(x){ return x.unitKey===key; })[0];
          var ok = r2 && doneFn(r2);
          if(ok || ++tries >= 4) return ok;
          return poll();
        }).catch(function(){ return ++tries >= 4 ? false : poll(); });
      }
      return poll();
    }).then(function(ok){
      logState.busy = false; logRender();
      showToast(ok ? okMsg : failMsg, ok ? 'success' : 'error');
    });
  }

  // 긴 글은 문단 → 문장 순서로 잘라 쪽 사이에서 자연스럽게 이어지도록 한다.
  function pdfChunks(text){
    var out = [];
    String(text||'').split('\n').forEach(function(par){
      if(par.length <= 380){ out.push(par); return; }
      var sents = par.match(/[^.!?。]+[.!?。]*\s*/g) || [par], cur = '';
      sents.forEach(function(st){
        if(cur && (cur+st).length > 380){ out.push(cur); cur = ''; }
        while(st.length > 380){ out.push(st.slice(0,380)); st = st.slice(380); }
        cur += st;
      });
      if(cur) out.push(cur);
    });
    return out.length ? out : [''];
  }
  function pdfTextBlocks(label, text){
    var ch = pdfChunks(text), blocks = [];
    ch.forEach(function(c, i){
      var tx = '<div class="tx'+(c.trim()?'':' empty')+'">'+(c.trim() ? pdfEsc(c) : (i===0 && ch.length===1 ? '(내용 없음)' : '&nbsp;'))+'</div>';
      blocks.push('<div class="pb" style="margin-bottom:'+(i<ch.length-1?'0':'9px')+';">'+(i===0 ? '<div class="lb">'+pdfEsc(label)+'</div>' : '')+tx+'</div>');
    });
    return blocks;
  }
  function pdfPhotoBlocks(ids){

    }
    return blocks;
  }

  function pdfWaitImages(root){

  // docs: [{kind:'r'|'l', obj}]  → A4 PDF (문서마다 새 쪽에서 시작, 블록은 쪽 사이에서 잘리지 않음)
  function pdfMakeFile(docs, filename, setLabel){
    if(typeof html2canvas==='undefined' || !window.jspdf) return Promise.reject(new Error('lib'));
    var ids = [];
    docs.forEach(function(d){
      if(d.kind==='r') ids = ids.concat(d.obj.photoIds||[]);
      else (d.obj.entries||[]).forEach(function(en){ ids = ids.concat(en.photoIds||[]); });
    });
    var styleEl = document.createElement('style'); styleEl.textContent = LG_PDF_CSS; document.head.appendChild(styleEl);
    var meas = document.createElement('div'); meas.className = 'pdfm'; document.body.appendChild(meas);
    var stage = document.createElement('div'); stage.style.cssText = 'position:fixed; left:-10000px; top:0;'; document.body.appendChild(stage);
    function cleanup(){ [styleEl, meas, stage].forEach(function(n){ if(n.parentNode) n.parentNode.removeChild(n); }); }

    return pdfLoadPhotos(ids).then(function(){
      var CONTENT_H = 1123 - 70 - 62, pages = [];
      docs.forEach(function(d){
        var blocks = pdfDocBlocks(d);
        meas.innerHTML = blocks.join('');
        var title = current.title + ' · ' + (d.kind==='r' ? '보고서' : '활동일지 ('+d.obj.submitterName+')');
        var cur = {title:title, html:''}, used = 0;
        pages.push(cur);
        [].slice.call(meas.children).forEach(function(n){
          var cs = getComputedStyle(n), h = n.getBoundingClientRect().height + (parseFloat(cs.marginBottom)||0) + (parseFloat(cs.marginTop)||0);
          if(used + h > CONTENT_H && used > 0){ cur = {title:title, html:''}; pages.push(cur); used = 0; }
          cur.html += n.outerHTML; used += h;
        });
      });
      return pages;
    }).then(function(pages){
      var jsPDF = window.jspdf.jsPDF, pdf = new jsPDF({unit:'mm', format:'a4'});
      var i = 0;
      function next(){
        if(i >= pages.length){ pdf.save(filename); cleanup(); return Promise.resolve(); }
        if(setLabel) setLabel((i+1)+'/'+pages.length+'쪽 만드는 중…');
        stage.innerHTML = '<div class="pdfp"><div class="pg-head"><span>'+pdfEsc(pages[i].title)+'</span><span>충남외국어고등학교</span></div><div class="pg-body">'+pages[i].html+'</div><div class="pg-foot">'+(i+1)+' / '+pages.length+'</div></div>';
        var pageEl = stage.firstChild;
        return pdfWaitImages(pageEl).then(function(){
          return html2canvas(pageEl, {scale:2, backgroundColor:'#ffffff', useCORS:true});
        }).then(function(canvas){
          if(i>0) pdf.addPage();
          pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 210, 297);
          i++; return next();
        });
      }
      return next();
    }).catch(function(e){ cleanup(); throw e; });
  }

    hs.items.forEach(function(it, i){
      var warn = /다른 사람|거부/.test(it.note||'') || it.action==='복원 거부';

        + (it.beforeSummary ? '<div class="hx-sum">변경 전 → '+esc(it.beforeSummary)+'</div>' : '')
        + '</td><td>'+(it.restorable ? '<button class="ex-btn danger" style="padding:4px 8px;font-size:11.5px;" data-hxr="'+i+'">이 변경 전으로 되돌리기</button>' : '')+'</td></tr>';
    });
    h += '</table></div><div class="ex-note">되돌리기는 선택한 변경 <b>이전 상태</b>로 되돌려요. 그 뒤에 바뀐 내용도 함께 사라지지만, 되돌리기 자체도 이력에 남아서 다시 되돌릴 수 있어요. 교사 확인이 끝난 보고서는 먼저 확인을 취소해야 하고, 확인이 끝난 일지 차시는 그대로 유지돼요.</div></div>';

  function hxFetch(){
    var key = logState.detailKey;
    return fetch(SHEET_SYNC_URL_FIXED + '?history=' + encodeURIComponent(current.id) + '&unit=' + encodeURIComponent(key.slice(2)) + '&kind=' + encodeURIComponent(key.charAt(0)==='r' ? '보고서' : '활동일지'))
      .then(function(r){ return r.json(); })
      .then(function(d){ if(!d || !d.items) throw new Error('no history'); return d; });
  }
  function hxLoad(){
    var key = logState.detailKey;
    logState.hist = { key:key, busy:true, fail:false, items:[], maxRow:0 };
    logRender();
    hxFetch().then(function(d){ logState.hist.items = d.items; logState.hist.maxRow = d.maxRow||0; })
      .catch(function(){ logState.hist.fail = true; })
      .then(function(){ logState.hist.busy = false; logRender(); });
  }
  function hxRestore(idx){
    var hs = logState.hist, it = hs.items[idx]; if(!it) return;
    var name = currentUser ? currentUser.name : '';
    if(!name){ showToast('로그인 후 다시 시도해주세요.', 'error'); return; }
    var kind = logState.detailKey.charAt(0), key = logState.detailKey.slice(2);
    if(kind==='r'){
      var rp = logState.server.reports.filter(function(x){ return x.unitKey===key; })[0];
      if(rp && rp.confirmed){ showToast('교사 확인이 끝난 보고서예요. 먼저 "교사 확인 취소"를 한 뒤 되돌려주세요.', 'error'); return; }
    }
    if(!confirm(lgFmt(it.ts)+' '+it.action+'('+it.sid+' '+it.name+') 이전 상태로 되돌릴까요?\n\n그 뒤에 바뀐 내용도 함께 사라져요.\n(되돌리기도 이력에 남고, 다시 되돌릴 수 있어요.)')) return;
    var prevMax = hs.maxRow || 0;
    fetch(SHEET_SYNC_URL_FIXED, {
      method:'POST', mode:'no-cors', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:'history_restore', planId:current.id, unitKey:key, row:it.row, ts:it.ts, restorer:name })
    }).then(function(){
      hs.busy = true; logRender();
      var tries = 0;
      function poll(){
        return new Promise(function(r){ setTimeout(r, 2200); }).then(hxFetch).then(function(d){
          var fresh = d.items.filter(function(x){ return x.row > prevMax && (x.action==='복원' || x.action==='복원 거부'); });
          if(fresh.length){ hs.items = d.items; hs.maxRow = d.maxRow||0; return fresh[0]; }
          if(++tries >= 5) return null;
          return poll();
        }).catch(function(){ return ++tries >= 5 ? null : poll(); });
      }
      return poll();
    }).then(function(res){
      return fetch(SHEET_SYNC_URL_FIXED + '?exec=' + encodeURIComponent(current.id)).then(function(r){ return r.json(); })
        .then(function(d){ logState.server = {reports:d.reports||[], logs:d.logs||[]}; }).catch(function(){}).then(function(){ return res; });
    }).then(function(res){
      hs.busy = false; logRender();
      if(res && res.action==='복원') showToast('되돌렸어요. 내용을 확인해주세요.', 'success');
      else if(res) showToast('되돌리지 못했어요: '+(res.note||''), 'error');
      else showToast('되돌리기가 시트에 반영되지 않았어요. Apps Script를 최신 버전(v24)으로 배포했는지 확인해주세요.', 'error');
    });
  }

      if(!logState.fail && (S.reports.length || S.logs.length)) h += '<div class="ex-actions"><button class="ex-btn" id="pdfAllBtn">📥 보고서·활동일지 전체 PDF 저장</button></div>';

  function logHydrate(){
    document.querySelectorAll('#logPanel img[data-pid]').forEach(function(img){
      var id = img.getAttribute('data-pid');
      if(logPhotoCache[id]){ img.src = logPhotoCache[id]; return; }
      fetch(SHEET_SYNC_URL_FIXED + '?photo=' + encodeURIComponent(id)).then(function(r){ return r.json(); }).then(function(d){
        if(d && d.data){ logPhotoCache[id] = d.data; document.querySelectorAll('#logPanel img[data-pid="'+id+'"]').forEach(function(el){ el.src = d.data; }); }
      }).catch(function(){});
    });
  }
  document.getElementById('logPanel').addEventListener('click', function(e){
    var img = e.target.closest && e.target.closest('.ex-ph img');
    if(img && img.src){
      var lb = document.createElement('div'); lb.className = 'ex-lightbox'; lb.innerHTML = '<img src="'+img.src+'" alt="">';
      lb.onclick = function(){ lb.remove(); }; document.body.appendChild(lb);
    }
  });
  function logUnconfirm(){
    var key = logState.detailKey.slice(2);
    var lg = logState.server.logs.filter(function(x){ return x.unitKey===key; })[0];
    var nos = lg.entries.filter(function(x){ return x.confirmed; }).map(function(x){ return x.no; });
    if(!nos.length) return;
    if(!confirm('이 활동일지의 교사 확인을 취소할까요?\n취소하면 학생이 다시 수정할 수 있고, 교사 확인 완료 상태가 풀려요.')) return;
    fetch(SHEET_SYNC_URL_FIXED, {
      method:'POST', mode:'no-cors', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:'log_unconfirm', planId:current.id, unitKey:key, nos:nos })
    }).then(function(){
      logState.busy = true; logRender();
      var tries = 0;
      function poll(){
        return new Promise(function(r){ setTimeout(r, 2200); }).then(function(){
          return fetch(SHEET_SYNC_URL_FIXED + '?exec=' + encodeURIComponent(current.id)).then(function(r){ return r.json(); });
        }).then(function(d){
          logState.server = {reports:d.reports||[], logs:d.logs||[]};
          var l = logState.server.logs.filter(function(x){ return x.unitKey===key; })[0];
          var ok = l && !l.entries.some(function(en){ return nos.indexOf(en.no)!==-1 && en.confirmed; });
          if(ok || ++tries >= 4) return ok;
          return poll();
        }).catch(function(){ return ++tries >= 4 ? false : poll(); });
      }
      return poll();
    }).then(function(ok){
      logState.busy = false; logRender();
      showToast(ok ? '교사 확인을 취소했어요. 학생이 다시 수정할 수 있어요.' : '취소가 시트에 반영되지 않았어요. Apps Script 업데이트·배포를 확인해주세요.', ok ? 'success' : 'error');
    });
  }
  function logConfirmAll(){
    var name = currentUser ? currentUser.name : '';
    if(!name){ showToast('로그인 후 다시 시도해주세요.', 'error'); return; }
    var key = logState.detailKey.slice(2);
    var lg = logState.server.logs.filter(function(x){ return x.unitKey===key; })[0];
    var nos = lg.entries.filter(function(x){ return !x.confirmed; }).map(function(x){ return x.no; });
    if(!confirm('이 활동일지('+lg.entries.length+'개 차시)를 확인 처리할까요?\n확인하면 학생이 수정할 수 없습니다.')) return;
    try{ localStorage.setItem('cne-confirm-teacher', name); }catch(e){}
    fetch(SHEET_SYNC_URL_FIXED, {
      method:'POST', mode:'no-cors', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:'log_confirm', planId:current.id, unitKey:key, nos:nos, confirmer:name })
    }).then(function(){
      logState.busy = true; logRender();
      var tries = 0;
      function poll(){
        return new Promise(function(r){ setTimeout(r, 2200); }).then(function(){
          return fetch(SHEET_SYNC_URL_FIXED + '?exec=' + encodeURIComponent(current.id)).then(function(r){ return r.json(); });
        }).then(function(d){
          logState.server = {reports:d.reports||[], logs:d.logs||[]};
          var l = logState.server.logs.filter(function(x){ return x.unitKey===key; })[0];

          if(ok || ++tries >= 4) return ok;

      return poll();

      logState.busy = false; logRender();
      showToast(ok ? '교사 확인이 완료되었어요.' : '확인 처리가 시트에 반영되지 않았어요. Apps Script 업데이트·배포를 확인해주세요.', ok ? 'success' : 'error');
    });

  var siteRole = 'teacher'; // 로그인한 교사만 사용 (계획서 조회 메뉴에서는 CSS로 발급·확인 버튼을 숨김)

  function bindConfirmSheet(){
    var sheet = document.getElementById('sheet');
    if(siteRole !== 'teacher') return; // 학생 모드에서는 제외 토글/사유 입력을 아예 걸지 않음(조회·인쇄 전용)
    sheet.querySelectorAll('[data-exclude-idx]').forEach(function(btn){
      btn.onclick = function(){
        var idx = +btn.getAttribute('data-exclude-idx');
        var s = current.students[idx];
        if(!s) return;
        s.excluded = !s.excluded;
        if(!s.excluded){ s.excludeReason = ''; }
        renderSheet();
      };
    });
    sheet.querySelectorAll('[data-remove-idx]').forEach(function(btn){
      btn.onclick = function(){
        var idx = +btn.getAttribute('data-remove-idx');
        if(current.students[idx] && current.students[idx].added){ current.students.splice(idx,1); renderSheet(); }
      };
    });
    var addBtn = document.getElementById('addStuBtn');
    if(addBtn){
      var doAdd = function(){
        var sid = (document.getElementById('addSid').value||'').trim();
        var name = (document.getElementById('addName').value||'').trim();
        if(!sid){ showToast('학번을 입력해주세요.', 'error'); return; }
        if(!name){ showToast('이름을 입력해주세요.', 'error'); return; }
        if(/[\s,:]/.test(sid) || /[,:]/.test(name)){ showToast('학번에는 공백·쉼표·콜론을, 이름에는 쉼표·콜론을 쓸 수 없어요.', 'error'); return; }
        var dup = current.students.filter(function(x){ return x.sid.trim()===sid; })[0];
        if(dup){ showToast('이미 명단에 있는 학번이에요: '+dup.sid+' '+dup.name, 'error'); return; }
        if(current.students.length >= 80){ showToast('학생은 최대 80명까지 넣을 수 있어요.', 'error'); return; }
        current.students.push({ sid:sid, name:name, excluded:false, excludeReason:'', added:true });
        renderSheet();
        showToast(name+' 학생을 추가했어요. 위쪽 [전송 및 인쇄] 버튼을 눌러야 저장돼요.', 'success');
      };
      addBtn.onclick = doAdd;
      ['addSid','addName'].forEach(function(i){ document.getElementById(i).onkeydown = function(e){ if(e.key==='Enter') doAdd(); }; });
    }
    sheet.querySelectorAll('[data-reason-idx]').forEach(function(input){
      input.oninput = function(){
        var idx = +input.getAttribute('data-reason-idx');
        var s = current.students[idx];
        if(s) s.excludeReason = input.value;
      };
    });
  }

  function renderSheet(){

    sheet.innerHTML = (viewMode==='plan') ? buildPlanReadOnlyHtml() : buildConfirmHtml();
    bindConfirmSheet();
  }

  function applyTableScale(doc, scale){
    var existing = doc.getElementById('__fit_style__');
    if(existing) existing.remove();
    if(scale >= 0.999) return;

    var BASE_FONT = 12, BASE_TH_FONT = 11.5, BASE_IDX_FONT = 11.5;
    var BASE_PAD_V = 3, BASE_PAD_H = 2, BASE_TH_PAD_V = 4, BASE_TH_PAD_H = 2;
    var IDX_MIN_FONT = 10.5, TH_MIN_FONT = 10.5, TOTAL_MIN_FONT = 11;
    var idxFontSize = Math.max(IDX_MIN_FONT, BASE_IDX_FONT*scale);
    var thFontSize = Math.max(TH_MIN_FONT, BASE_TH_FONT*scale);
    var thPadV = Math.max(3, BASE_TH_PAD_V*scale);
    var thPadH = Math.max(2, BASE_TH_PAD_H*scale);
    var css =
      '.students-tbl{font-size:'+(BASE_FONT*scale).toFixed(2)+'px !important;}'+
      '.students-tbl th{font-size:'+thFontSize.toFixed(2)+'px !important; padding:'+thPadV.toFixed(2)+'px '+thPadH.toFixed(2)+'px !important;}'+
      '.students-tbl .idx{font-size:'+idxFontSize.toFixed(2)+'px !important;}'+
      '.total-row .total-label, .total-row .total-value{font-size:'+TOTAL_MIN_FONT+'px !important; padding:5px 8px !important;}'+
      '.confirm-tbl td{padding:'+(BASE_PAD_V*scale).toFixed(2)+'px '+(BASE_PAD_H*scale).toFixed(2)+'px !important;}'+
      '.exclude-x{font-size:'+Math.max(8,(10*scale)).toFixed(2)+'px !important;}';
    var styleEl = doc.createElement('style');
    styleEl.id = '__fit_style__';
    styleEl.textContent = css;
    doc.head.appendChild(styleEl);
  }

  function fitStudentsTable(doc, sheetEl, maxHeightPx){
    var table = doc.querySelector('.students-tbl');
    if(!table) return;
    if(sheetEl.scrollHeight <= maxHeightPx) return;
    var scale = 1;
    for(var attempt=0; attempt<7; attempt++){
      applyTableScale(doc, scale);
      var actualH = sheetEl.scrollHeight;
      if(actualH <= maxHeightPx) return;
      var overflowRatio = actualH / maxHeightPx;
      var nextScale = Math.max(0.8, scale / overflowRatio * 0.97);
      if(nextScale >= scale){ nextScale = scale * 0.9; }
      scale = nextScale;
    }
    applyTableScale(doc, scale);
  }

  function autoFitSheet(doc){
    try{
      var target = doc.querySelector('.sheet');
      var mmToPx = 96 / 25.4;
      var maxHeightPx = 277 * mmToPx * 0.93;
      fitStudentsTable(doc, target, maxHeightPx);
      var actualH = target.scrollHeight;
      if(actualH > maxHeightPx){
        var zoom = Math.max(0.5, maxHeightPx / actualH);
        target.style.zoom = zoom;
      }
      return target;
    }catch(e){ return null; }
  }

  function flattenFormFieldsForCanvas(doc){
    doc.querySelectorAll('input.exclude-reason-input').forEach(function(el){
      var span = doc.createElement('span');
      span.className = el.className;
      span.textContent = el.value || '';
      span.style.display = 'inline-block';
      span.style.width = el.style.width ? el.style.width : '100%';
      span.style.whiteSpace = 'pre';
      el.parentNode.replaceChild(span, el);
    });
  }

  function buildPrintables(){
    var sheetEl = document.getElementById('sheet');
    var styleContent = document.querySelector('style').innerHTML;
    var screenAndPrintCSS = styleContent.replace('@media print{', '@media screen, print{');
    return { css: screenAndPrintCSS, html: sheetEl.outerHTML };
  }

  function printSheet(){
    if(!current){ return; }
    var built = buildPrintables();
    var w = window.open('', '_blank');
    if(!w){ window.print(); return; }
    w.document.open();
    w.document.write(
      '<!DOCTYPE html><html><head><meta charset="utf-8">'+
      '<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">'+
      '<title>봉사활동 확인서</title><style>'+built.css+'body{background:#fff;margin:0;}</style></head><body>'+built.html+'</body></html>'
    );
    w.document.close();
    setTimeout(function(){
      autoFitSheet(w.document);
      w.focus();
      w.print();
    }, 700);
  }
  document.getElementById('printBtn').onclick = printSheet;

  document.getElementById('pdfBtn').onclick = function(){
    if(!current){ return; }
    var pdfBtn = document.getElementById('pdfBtn');
    var originalLabel = pdfBtn.textContent;
    pdfBtn.disabled = true;
    pdfBtn.textContent = '생성 중…';

    var built = buildPrintables();
    var iframe = document.createElement('iframe');
    iframe.style.position = 'fixed';
    iframe.style.left = '-10000px';
    iframe.style.top = '0';
    iframe.style.width = '794px';
    iframe.style.height = '1123px';
    iframe.style.border = 'none';
    document.body.appendChild(iframe);

    var idoc = iframe.contentDocument;
    idoc.open();
    idoc.write(
      '<!DOCTYPE html><html><head><meta charset="utf-8">'+
      '<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">'+
      '<style>'+built.css+'body{background:#fff;margin:0;}'+
      '.sheet{width:718px !important; box-sizing:border-box !important; margin:0 !important;}'+ /* 인쇄와 같은 비율: A4 190mm(좌우 여백 10mm) 폭 */
      '*{font-family:sans-serif !important;}'+
      '.sheet-h1, .approve-title{font-family:serif !important;}'+
      '</style></head><body>'+built.html+'</body></html>'
    );
    idoc.close();

    function cleanup(){
      pdfBtn.disabled = false;
      pdfBtn.textContent = originalLabel;
      if(iframe.parentNode) iframe.parentNode.removeChild(iframe);
    }

    setTimeout(function(){
      var target = autoFitSheet(idoc);
      if(!target || typeof html2canvas==='undefined' || !window.jspdf){
        cleanup();
        alert('PDF 생성 기능을 불러오지 못했습니다. "인쇄" 버튼을 이용해 PDF로 저장해주세요.');
        return;
      }
      flattenFormFieldsForCanvas(idoc);
      html2canvas(target, { scale: 2, useCORS: true, backgroundColor: '#ffffff', foreignObjectRendering: true }).then(function(canvas){
        var imgData = canvas.toDataURL('image/png');
        var jsPDF = window.jspdf.jsPDF;
        var pdf = new jsPDF({ unit: 'mm', format: 'a4' });
        var pageWidth = 210, pageHeight = 297;
        var MARGIN = 10; // 인쇄 화면(@page margin 10mm)과 같은 여백
        var imgWidth = pageWidth - MARGIN*2;
        var imgHeight = canvas.height * imgWidth / canvas.width;
        if(imgHeight > pageHeight - MARGIN*2){
          imgHeight = pageHeight - MARGIN*2;
          imgWidth = canvas.width * imgHeight / canvas.height;
        }
        var x = (pageWidth - imgWidth) / 2;
        var pdfFilename = (current.title || '봉사활동확인서').replace(/[\\/:*?"<>|]/g,'') + '.pdf';
        pdf.addImage(imgData, 'PNG', x, MARGIN, imgWidth, imgHeight);
        pdf.save(pdfFilename);
        cleanup();
      }).catch(function(){
        cleanup();
        alert('PDF 생성 중 오류가 발생했습니다. "인쇄" 버튼을 이용해 PDF로 저장해주세요.');
      });
    }, 700);
  };

  // ---------- 구글 시트에 발급 기록 ----------
  function formatExcludedList(students){
    return (students||[])
      .filter(function(s){ return s.excluded && (s.sid.trim() || s.name.trim()); })
      .map(function(s){ return s.sid.trim()+':'+s.name.trim()+':'+(s.excludeReason||'').trim(); })
      .join(', ');
  }

  function formatAddedList(students){
    return (students||[]).filter(function(s){ return s.added; }).map(function(s){ return s.sid.trim()+' '+s.name.trim(); }).join(', ');
  }
  // 발급 기록을 보낸 뒤, 다시 열었을 때도 같은 내용이 보이도록 화면에 들고 있는 목록을 맞춰 둔다.
  function syncRecordLocal(){
    [mineList, allList||[]].forEach(function(list){
      list.forEach(function(r){
        if(r.id!==current.id) return;
        var prev = {}; parseStudentsText(r.added).forEach(function(s){ prev[s.sid]=true; });
        var base = parseStudentsText(r.students).filter(function(s){ return !prev[s.sid]; })
          .map(function(s){ return s.sid+' '+s.name; });
        var added = formatAddedList(current.students);
        r.added = added;
        r.students = base.concat(added ? [added] : []).join(', ');
        r.excluded = formatExcludedList(current.students);
      });
    });
  }

  // [전송 및 인쇄]: 구글 시트에 발급 기록을 먼저 보내고, 전송에 성공했을 때만 인쇄 창을 연다.
  document.getElementById('issueBtn').onclick = function(){
    if(!current || !current.id){ return; }
    var btn = document.getElementById('issueBtn');
    if(btn.disabled) return;
    var label = btn.textContent;
    btn.disabled = true; btn.textContent = '전송 중…';
    var payload = {
      action: 'confirm_issue',
      id: current.id,
      type: current.type || '',
      title: current.title || '',
      excludedList: formatExcludedList(current.students),
      addedList: formatAddedList(current.students),
      addedBy: currentUser ? currentUser.name : ''
    };
    fetch(SHEET_SYNC_URL_FIXED, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    }).then(function(){
      syncRecordLocal();
      btn.disabled = false; btn.textContent = label;
      showToast('구글 시트에 발급 기록을 전송했어요. 인쇄 창을 엽니다.', 'success');
      printSheet();
    }).catch(function(){
      btn.disabled = false; btn.textContent = label;
      showToast('전송에 실패해서 인쇄하지 않았어요. 인터넷 연결을 확인하고 다시 눌러주세요.', 'error');
    });
  };
  try{ var saved = JSON.parse(localStorage.getItem('cne-confirm-login')||'null');
    if(saved && saved.id && saved.name){ document.getElementById('loginId').value = saved.id; document.getElementById('loginName').value = saved.name; doLogin(saved.id, saved.name, false); } }catch(e){}
})();
</script>
