<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>학생 주도 프로젝트형 봉사활동 보고서·활동일지</title>
<style>
  :root{ --navy:#16233F; --mint:#2E9E77; --mint-2:#268A67; --paper:#EFEFEF; --line:#2C3A5C; --ink:#22262E; --ink-soft:#6B7280; --seal:#C0392B; }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Noto Sans KR','Pretendard',-apple-system,sans-serif; color:var(--ink); background:var(--paper);}
  button,input,textarea{font-family:inherit;}
  .topbar{background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 18px; flex-wrap:wrap;}
  .topbar .t1{font-size:13px; font-weight:700;}
  .topbar .t2{font-size:11px; color:#9AA6C4;}
  .topbar .who{font-size:11.5px; color:#DCE3F0;}
  .logout-link{background:none; border:none; color:#9AA6C4; font-size:11px; cursor:pointer; text-decoration:underline; margin-left:8px;}
  .exec-main{padding:22px 16px 60px;}
  /* ---------- LOGIN GATE ---------- */
  .login-gate{
    position:fixed; inset:0; background:var(--navy); color:#fff; z-index:100;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .login-card{
    background:#fff; color:var(--ink); width:100%; max-width:360px; border-radius:14px;
    padding:28px 26px; box-shadow:0 12px 40px rgba(0,0,0,.35);
  }
  .login-eyebrow{font-size:11px; letter-spacing:.1em; color:var(--ink-soft); text-transform:uppercase; text-align:center;}
  .login-title{font-size:17px; font-weight:700; text-align:center; margin:4px 0 20px;}
  .login-role-seg{display:flex; background:#F0F1F4; border-radius:9px; padding:3px; margin-bottom:16px;}
  .login-role-opt{flex:1; text-align:center; padding:9px 4px; font-size:13px; font-weight:700; color:var(--ink-soft); border-radius:7px; cursor:pointer;}
  .login-role-opt.on{background:var(--navy); color:#fff;}
  .login-field-label{font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:5px; display:block;}
  .login-input{
    width:100%; border:1px solid var(--line); border-radius:8px; padding:11px 12px; font-size:14px;
    margin-bottom:6px;
  }
  .login-hint{font-size:11px; color:var(--ink-soft); margin-bottom:16px; line-height:1.5;}
  .login-btn{
    width:100%; padding:12px; border:none; border-radius:9px; background:var(--mint); color:#fff;
    font-size:14.5px; font-weight:700; cursor:pointer;
  }
  .login-err{font-size:12px; color:var(--seal); margin-bottom:10px; display:none;}
  .login-disclaimer{font-size:10.5px; color:#9AA6C4; text-align:center; margin-top:16px; line-height:1.5;}

  .toast{
    position:fixed; top:18px; left:50%; transform:translateX(-50%) translateY(-12px);
    background:var(--ink); color:#fff; padding:11px 20px; border-radius:8px; font-size:13.5px;
    font-weight:600; box-shadow:0 6px 20px rgba(0,0,0,.25); z-index:200;
    opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast.success{background:var(--mint);}
  .toast.error{background:var(--seal);}  /* ---------- 실행 보고 (보고서 · 활동일지) ---------- */
  .exec-btn{
    width:100%; margin-bottom:12px; background:linear-gradient(135deg, #C9772B, #E0A04B); color:#fff;
    border:none; font-weight:700; padding:8px 4px; font-size:12px; border-radius:6px; flex:none; cursor:pointer;
  }
  .exec-btn:hover{opacity:.92;}
  .app.exec-mode .seg2, .app.exec-mode #roleHint, .app.exec-mode .sb-list, .app.exec-mode .sb-actions{display:none;}
  .app.exec-mode .sidebar{justify-content:flex-start;}
  .ex-wrap{max-width:820px; margin:0 auto;}
  .ex-eyebrow{font-size:11px; color:var(--ink-soft); letter-spacing:.06em;}
  .ex-title{font-size:20px; font-weight:800; color:var(--navy); margin:2px 0 14px;}
  .ex-crumb{display:flex; gap:6px; flex-wrap:wrap; font-size:11.5px; margin-bottom:14px;}
  .ex-crumb span{padding:4px 10px; border-radius:12px; background:#E3E7EF; color:#6B7280; font-weight:700;}
  .ex-crumb span.on{background:var(--navy); color:#fff;}
  .ex-crumb span.done{background:#CFEBDD; color:#1F7A58;}
  .ex-card{background:#fff; border:1px solid #DADFE8; border-radius:10px; padding:16px 18px; margin-bottom:12px; box-shadow:0 2px 8px rgba(20,25,40,.05);}
  .ex-card h3{margin:0 0 8px; font-size:14.5px; color:var(--navy);}
  .ex-note{font-size:12px; color:var(--ink-soft); line-height:1.55;}
  .ex-warn{font-size:12px; color:#B5651D; background:#FFF5E6; border:1px solid #F0D6AE; border-radius:7px; padding:8px 10px; margin-bottom:10px;}
  .ex-err{font-size:12px; color:var(--seal); margin:8px 0;}
  .ex-row{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .ex-input, .ex-ta{
    width:100%; border:1px solid #C9D0DE; border-radius:7px; padding:8px 10px; font-size:13px; background:#fff; color:var(--ink);
  }
  .ex-ta{min-height:92px; resize:vertical; line-height:1.55;}
  .ex-input:disabled, .ex-ta:disabled{background:#F2F4F8; color:#555;}
  .ex-btn{border:none; border-radius:7px; padding:9px 16px; font-size:12.5px; font-weight:700; cursor:pointer; background:var(--navy); color:#fff;}
  .ex-btn.mint{background:var(--mint);}
  .ex-btn.ghost{background:#E3E7EF; color:var(--navy);}
  .ex-btn.danger{background:#fff; color:var(--seal); border:1px solid #E5B7B1;}
  .ex-btn:disabled{opacity:.5; cursor:not-allowed;}
  .ex-item{display:block; width:100%; text-align:left; background:#fff; border:1px solid #DADFE8; border-radius:9px; padding:11px 13px; margin-bottom:8px; cursor:pointer;}
  .ex-item:hover{border-color:var(--mint);}
  .ex-item b{font-size:13.5px; color:var(--navy);}
  .ex-item .sub{font-size:11.5px; color:var(--ink-soft); margin-top:3px;}
  .ex-chip{display:inline-block; font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:9px; margin-left:6px; vertical-align:middle;}
  .ex-chip.ok{background:#CFEBDD; color:#1F7A58;}
  .ex-chip.wait{background:#FBEBC6; color:#9A6B00;}
  .ex-chip.none{background:#E3E7EF; color:#6B7280;}
  .ex-radio{display:flex; gap:10px; margin:6px 0 10px; flex-wrap:wrap;}
  .ex-radio label{flex:1; min-width:220px; border:1.5px solid #C9D0DE; border-radius:9px; padding:11px 13px; cursor:pointer; font-size:12.5px; background:#fff;}
  .ex-radio label.on{border-color:var(--mint); background:#EEF8F3;}
  .ex-radio label b{display:block; font-size:13.5px; color:var(--navy); margin-bottom:2px;}
  .ex-members{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:4px 10px; margin:6px 0;}
  .ex-members label{font-size:12.5px; display:flex; gap:6px; align-items:center;}
  .ex-doc-title{text-align:center; font-family:'Batang','바탕','Noto Serif KR',serif; font-weight:700; font-size:18px; margin-bottom:14px;}
  .ex-label{font-size:12.5px; font-weight:700; color:var(--navy); margin:12px 0 5px;}
  .ex-tbl{width:100%; border-collapse:collapse; font-size:12px; margin:4px 0;}
  .ex-tbl td, .ex-tbl th{border:1px solid #888; padding:4px 8px; text-align:center;}
  .ex-tbl th{background:#F1F3F7;}
  .ex-entry{border-left:5px solid var(--navy); border-top:1px solid #C9D0DE; border-right:1px solid #C9D0DE; border-bottom:1px solid #C9D0DE; border-radius:10px; padding:13px 15px; margin-bottom:12px; background:#FCFCFE;}
  .ex-entry.confirmed{background:#F4FAF7; border-color:#9BD2B8; border-left-color:#2E8B66;}
  .ex-absent{border:1.5px dashed #C9D0DE; border-radius:10px; padding:11px 14px; margin:12px 0; background:#FAFBFD;}
  .ex-absent.on{border-color:#B5651D; background:#FFF8EC;}
  .ex-absent b{color:var(--navy);}
  /* 계획서 문서 양식 (계획서 입력 화면과 동일) */
  .sheet{
    background:#fff; max-width:760px; margin:16px auto; padding:34px 38px 30px;
    box-shadow:0 4px 18px rgba(20,25,40,.12); border:1px solid #DADFE8;
  }
  .sheet-note{font-size:11px; text-align:center; color:var(--ink-soft); margin-bottom:6px;}
  .sheet-h1{
    text-align:center; font-family:'Batang','바탕',serif; font-weight:700; font-size:23px;
    letter-spacing:.3em; padding-left:.3em; margin-bottom:22px;
  }
  table.doc{width:100%; border-collapse:collapse; font-size:12.5px;}
  table.doc td, table.doc th{border:1px solid #333; padding:7px 9px; vertical-align:middle;}
  td.rowno{width:26px; text-align:center; font-weight:700; background:#F4F4F4; font-size:12px;}
  td.rowlabel{width:132px; font-weight:700; background:#F4F4F4; font-size:11.5px; line-height:1.35;}
  td.rowval{ }
  .fixed-text{color:#444; font-size:12.5px;}

  .students-tbl{width:100%; border-collapse:collapse; font-size:12px; table-layout:fixed;}
  .students-tbl th{background:#F7F7F5; border:1px solid #333; padding:2px 1px; font-size:10px; white-space:nowrap; line-height:1.1;}
  .students-tbl td{border:1px solid #333; padding:0; text-align:center; vertical-align:middle;}
  .confirm-tbl td{padding:3px 2px;}
  .students-tbl .idx{background:#FAFAF8; color:var(--ink-soft) !important; font-size:11.5px; white-space:nowrap;}
  .students-tbl a, table.doc a{color:inherit !important; text-decoration:none !important; pointer-events:none;}

  .total-row td{border:1px solid #333;}
  .total-row .total-label{font-weight:700; text-align:center; background:#F7F7F5;}
  .total-row .total-value{font-weight:700; text-align:center;}
  .statement{text-align:center; font-size:12.5px; line-height:2; margin:26px 0 6px;}
  .sign-row{display:flex; justify-content:center; align-items:center; gap:6px; font-size:12.5px; margin-bottom:22px;}
  .approve-block{text-align:center; margin-top:10px; position:relative;}
  .approve-title{font-size:14px; font-weight:700; letter-spacing:.25em; padding-left:.25em; margin-top:8px; position:relative; display:inline-block;}
  .seal{position:absolute; right:-64px; top:-16px; width:64px; height:64px; opacity:.92;}
  .seal img{width:100%; height:100%; object-fit:contain; display:block;}
  .sheet-wrap{overflow-x:auto;}
  @media (max-width:640px){ .sheet{padding:18px 12px 18px; margin:8px 0;} .sheet-h1{font-size:19px;} td.rowlabel{width:92px;} }
  .ex-tp{display:inline-block; font-size:10.5px; font-weight:800; padding:2px 9px; border-radius:9px; margin-right:6px; vertical-align:middle;}
  .ex-tp.proj{background:#F6DEDA; color:#8A2A1F;}
  .ex-tp.sel{background:#DCEBD3; color:#2F6B1A;}
  .ex-item.tp-proj{border-left:5px solid #B5453A;}
  .ex-item.tp-sel{border-left:5px solid #4E8F34;}
  .sheet.tp-proj{border-top:6px solid #B5453A;}
  .sheet.tp-sel{border-top:6px solid #4E8F34;}
  .sheet-type{text-align:center; margin-bottom:8px;}
  .ex-menu{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media (max-width:560px){ .ex-menu{grid-template-columns:1fr;} }
  .ex-menu-btn{display:flex; flex-direction:column; gap:4px; align-items:flex-start; text-align:left; border:1.5px solid #C9D0DE; background:#fff; border-radius:12px; padding:16px 16px; cursor:pointer; font-family:inherit; font-size:12.5px; color:var(--ink-soft);}
  .ex-menu-btn:hover{border-color:var(--mint); background:#EEF8F3;}
  .ex-menu-btn b{font-size:15px; color:var(--navy);}
  .ex-menu-btn .ic{font-size:22px;}
  .ex-no{display:inline-block; background:var(--navy); color:#fff; font-size:15px; font-weight:800; padding:4px 14px; border-radius:999px; margin-right:6px; letter-spacing:.3px;}
  .ex-entry.confirmed .ex-no{background:#2E8B66;}
  .ex-entry-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-weight:800; color:var(--navy); font-size:13.5px;}
  .ex-grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .ex-ro{white-space:pre-wrap; font-size:13px; line-height:1.6; background:#F7F8FB; border-radius:7px; padding:8px 10px; min-height:34px;}
  .ex-photos{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px;}
  .ex-ph{position:relative; width:96px; height:96px; border-radius:8px; overflow:hidden; border:1px solid #C9D0DE; background:#EEF0F5;}
  .ex-ph img{width:100%; height:100%; object-fit:cover; cursor:zoom-in;}
  .ex-ph-x{position:absolute; top:2px; right:2px; width:20px; height:20px; border:none; border-radius:50%; background:rgba(0,0,0,.6); color:#fff; font-size:13px; line-height:1; cursor:pointer;}
  .ex-add-photo{display:inline-flex; align-items:center; justify-content:center; width:96px; height:96px; border:1.5px dashed #9AA6C4; border-radius:8px; color:#6B7280; font-size:12px; cursor:pointer; text-align:center; background:#fff;}
  .ex-confirmbar{margin-top:10px; padding-top:9px; border-top:1px dashed #C9D0DE; display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; font-size:12.5px;}
  .ex-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px;}
  .ex-lightbox{position:fixed; inset:0; background:rgba(0,0,0,.8); display:flex; align-items:center; justify-content:center; z-index:9999; cursor:zoom-out;}
  .ex-lightbox img{max-width:92vw; max-height:92vh; border-radius:6px;}
</style></head><body>
<div class="toast" id="toast"></div>
<div class="login-gate" id="loginGate">
  <div class="login-card">
    <div class="login-eyebrow">충남외국어고등학교 · 교내 봉사활동</div>
    <div class="login-title">학생 주도 프로젝트형 봉사활동 보고서·활동일지</div>
    <label class="login-field-label">이메일 주소</label>
    <input type="text" class="login-input" id="loginId" placeholder="계획서를 작성할 때 쓴 이메일 주소" autocomplete="off">
    <label class="login-field-label" style="margin-top:8px;">성명</label>
    <input type="text" class="login-input" id="loginName" placeholder="본인 성명" autocomplete="off">
    <div class="login-hint">계획서에 등록된 본인 이름으로 내 봉사활동을 찾아요.</div>
    <div class="login-err" id="loginErr"></div>
    <button class="login-btn" id="loginBtn">시작하기</button>
    <div class="login-disclaimer">※ 실제 학교 계정과 연동된 인증은 아니며, 입력한 이메일·성명으로 본인 제출분을 구분하는 용도입니다.</div>
  </div>
</div>
<div id="app" style="display:none;">
  <div class="topbar"><div><div class="t1">봉사활동 실행 보고</div><div class="t2">활동 완료 후 보고서와 활동일지를 제출해요</div></div>
    <div class="who"><span id="userBadgeText"></span><button class="logout-link" id="logoutBtn">로그아웃</button></div></div>
  <div class="exec-main" id="execMain"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
  var SHEET_SYNC_URL_FIXED = 'https://script.google.com/macros/s/AKfycbwVo6giYVzEfT75pIRYuLe2CZY-RzqZD5IgJQ1mGA2O2bhqisoJNjj1SJMKiLdiMt8/exec';
  var appEl = document.getElementById('app');
  var loginGate = document.getElementById('loginGate');
  var currentUser = null;
  var listCache = [];
  var execActive = false;
  var ex = null;

  // 저장소: 이 브라우저(localStorage)
  var storageAPI = (function(){
    var PREFIX = 'cne-volunteer-report:';
    function wrap(fn){ return new Promise(function(res,rej){ try{ res(fn()); }catch(e){ rej(e); } }); }
    return {
      get: function(k){ return new Promise(function(res,rej){ try{ var v=localStorage.getItem(PREFIX+k); if(v===null) rej('no key'); else res({key:k,value:v}); }catch(e){ rej(e); } }); },
      set: function(k,v){ return wrap(function(){ localStorage.setItem(PREFIX+k, v); return {key:k,value:v}; }); },
      delete: function(k){ return new Promise(function(res){ try{ localStorage.removeItem(PREFIX+k); }catch(e){} res({key:k}); }); }
    };
  })();

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  var toastTimer = null;
  function showToast(msg, kind){
    var el = document.getElementById('toast'); el.textContent = msg; el.className = 'toast show'+(kind?' '+kind:'');
    if(toastTimer) clearTimeout(toastTimer); toastTimer = setTimeout(function(){ el.className = 'toast'; }, 2600);
  }
  window.addEventListener('error', function(e){ showToast('오류가 발생했습니다: '+(e.message||''), 'error'); });

  // 로그인 (학생 전용)
  function doLogin(id, name, persist){
    currentUser = { role:'student', id:id, name:name };
    loginGate.style.display = 'none'; appEl.style.display = '';
    document.getElementById('userBadgeText').textContent = '학생 · '+name+' · '+id;
    if(persist) storageAPI.set('my-login', JSON.stringify(currentUser)).catch(function(){});
    execActive = true; ex = newExState(); exRender();
  }
  document.getElementById('loginBtn').onclick = function(){
    var id = document.getElementById('loginId').value.trim(), nm = document.getElementById('loginName').value.trim();
    var err = document.getElementById('loginErr'); err.style.display = 'block';
    if(!id || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(id)){ err.textContent = '올바른 이메일 주소를 입력해주세요.'; return; }
    if(!nm){ err.textContent = '성명을 입력해주세요.'; return; }
    err.style.display = 'none'; doLogin(id, nm, true);
  };
  document.getElementById('logoutBtn').onclick = function(){
    storageAPI.delete('my-login').catch(function(){});
    currentUser = null; execActive = false; ex = null; appEl.style.display = 'none'; loginGate.style.display = '';
  };
  storageAPI.get('my-login').then(function(r){ var u = JSON.parse(r.value); document.getElementById('loginId').value = u.id; document.getElementById('loginName').value = u.name; doLogin(u.id, u.name, false); }).catch(function(){});

  // ======================= 실행 보고 (보고서 · 활동일지 · 증빙사진 · 교사 확인) =======================
  var execMain = document.getElementById('execMain');
  var execActive = false;
  var ex = null;
  var photoCache = {};
  // 보고서는 최대 4장, 활동일지는 차시마다 1장
  function maxPhotos(scope){ return scope==='report' ? 4 : 1; }
  var DEFAULT_PLACE = '충남외국어고등학교';

  function newExState(){
    return { step:'home', q:'', plans:null, plansLoading:false, planView:null, plansMsg:'', pickLoaded:false, results:null, loading:false, msg:'', plan:null, mode:'team',
      members:[], teamSel:{}, server:null, serverFail:false, unitKey:'', report:null, log:null,
      detailKey:'', busy:false, err:'' };
  }

  function parseStudents(str){
    return String(str||'').split(',').map(function(t){
      t = t.trim(); if(!t) return null;
      var m = t.match(/^(\S+)\s+(.+)$/);
      return m ? {sid:m[1], name:m[2]} : {sid:'', name:t};
    }).filter(Boolean);
  }
  function pkey(p){ return (p.sid||'')+'|'+(p.name||''); }
  function exPost(payload){
    return fetch(SHEET_SYNC_URL_FIXED, {
      method:'POST', mode:'no-cors',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
  }
  function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  function fmtDate(iso){
    if(!iso) return '';
    var d = new Date(iso); if(isNaN(d)) return String(iso);
    return (d.getMonth()+1)+'/'+d.getDate()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
  }

  // ---------- 1. 계획서 검색 · 선택 ----------
  // 서버(Apps Script)가 예전 버전이면 검색어를 무시하고 전체를 돌려줄 수 있어, 화면에서도 한 번 더 걸러 검색어와 맞는 것만 보여줍니다.
  function matchesQuery(r, q){
    var hay = [r.title, r.teacher, r.content, r.students, r.submitterName, r.area].join(' ').toLowerCase();
    return hay.indexOf(String(q).trim().toLowerCase()) !== -1;
  }

  function exSearch(q){
    q = (q||'').trim();
    ex.q = q; ex.msg = '';
    if(!q){ ex.results = []; ex.msg = '검색어를 입력해주세요.'; exRender(); return; }
    ex.loading = true; exRender();
    var localHits = listCache.filter(function(it){
      return it.type==='학생주도 프로젝트형' && it.status==='final' && currentUser && it.ownerId===currentUser.id;
    }).map(function(it){ return {id:it.id, title:it.title, teacher:it.teacher, students:null}; });
    fetch(SHEET_SYNC_URL_FIXED + '?q=' + encodeURIComponent(q))
      .then(function(r){ return r.json(); })
      .then(function(data){
        var arr = (data.results||[]).filter(function(r){ return r.type==='학생주도 프로젝트형' && matchesQuery(r, q); }).map(function(r){
          return {id:r.id, title:r.title, teacher:r.teacher, students:parseStudents(r.students), submitter:r.submitterName};
        });
        var seen = {}; arr.forEach(function(r){ seen[r.id] = true; });
        ex.results = arr.concat(localHits.filter(function(r){ return !seen[r.id]; }));
        ex.loading = false; exRender();
      })
      .catch(function(){
        ex.results = localHits; ex.loading = false;
        ex.msg = '구글 시트에서 계획서를 불러오지 못했어요. (이 기기에서 제출한 계획서만 표시됩니다)';
        exRender();
      });
  }

  function exPick(r){
    function go(plan){
      ex.plan = plan; ex.err = '';
      if(currentUser.role==='teacher'){ ex.step = 'tunits'; exLoadServer(); }
      else {
        ex.mode = 'team'; ex.teamSel = {};
        plan.students.forEach(function(s,i){ ex.teamSel[i] = true; });
        ex.reportMembers = plan.students.slice();
        if(exSelfIdx() < 0 && !confirm('이 계획서의 참가학생 명단에서 "'+currentUser.name+'" 이름을 찾지 못했어요.\n그래도 계속할까요?')){ ex.plan = null; return; }
        ex.step = 'hub'; exSetUnit(); exLoadServer();
      }
    }
    if(r.students){ go({id:r.id, title:r.title, teacher:r.teacher, students:r.students}); return; }
    storageAPI.get(r.id, true).then(function(res){
      var rec = JSON.parse(res.value);
      go({id:rec.id, title:rec.title, teacher:rec.teacher, students:(rec.students||[]).map(function(s){ return {sid:s.sid, name:s.name}; })});
    }).catch(function(){ showToast('계획서를 불러오지 못했어요.', 'error'); });
  }

  function exSelfIdx(){
    var nm = (currentUser.name||'').trim();
    for(var i=0;i<ex.plan.students.length;i++){ if(ex.plan.students[i].name.trim()===nm) return i; }
    return -1;
  }

  // ---------- 2. 활동일지 제출 단위(개인/팀) ----------
  // 보고서는 항상 팀 전체 1부(unitKey 'team'), 활동일지만 개인/팀 중 선택
  function exSetUnit(){
    var self = exSelfIdx();
    ex.unitKey = ex.mode==='team' ? 'team' : 'i:' + currentUser.id;
    if(ex.mode==='team'){
      var members = ex.plan.students.filter(function(s,i){ return ex.teamSel[i]; });
      if(self >= 0 && !ex.teamSel[self]){ ex.err = '팀 제출에는 본인도 포함되어야 해요.'; return false; }
      if(!members.length){ ex.err = '팀원을 1명 이상 선택해주세요.'; return false; }
      ex.members = members;
    } else {
      ex.members = [self>=0 ? ex.plan.students[self] : {sid:'', name:currentUser.name}];
    }
    ex.err = ''; return true;
  }

  function exLoadServer(){
    ex.busy = true; ex.serverFail = false; exRender();
    return fetch(SHEET_SYNC_URL_FIXED + '?exec=' + encodeURIComponent(ex.plan.id))
      .then(function(r){ return r.json(); })
      .then(function(d){ ex.server = {reports:d.reports||[], logs:d.logs||[]}; })
      .catch(function(){ ex.server = {reports:[], logs:[]}; ex.serverFail = true; })
      .then(function(){ ex.busy = false; exRender(); });
  }
  function srvReport(){
    return (ex.server&&ex.server.reports||[]).filter(function(x){ return x.unitKey==='team'; })[0] || null;
  }
  function srvLog(){
    return (ex.server&&ex.server.logs||[]).filter(function(x){ return x.unitKey===ex.unitKey; })[0] || null;
  }
  function draftKey(kind){ return 'exec-draft:'+ex.plan.id+':'+(kind==='report' ? 'team' : ex.unitKey)+':'+kind; }

  // ---------- 3. 보고서 ----------
  function blankEntry(no){
    return {no:no, date:'', place:DEFAULT_PLACE, participants:ex.members.slice(), content:'', reflection:'', photos:[],
      confirmed:false, confirmedBy:'', confirmedAt:''};
  }
  function exOpenReport(){
    var s = srvReport();
    if(s && s.confirmed){ showToast('교사 확인이 끝난 보고서는 수정할 수 없어요.', 'error'); return; }
    ex.reportView = false;
    var base = s ? {motive:s.motive||'', content:s.content||'', reflection:s.reflection||'',
                    photos:(s.photoIds||[]).map(function(id){ return {id:id}; }),
                    absentMembers:(s.absentMembers||[]).filter(function(a){ return ex.reportMembers.some(function(m){ return pkey(m)===pkey(a); }); })}
                 : {motive:'', content:'', reflection:'', photos:[], absentMembers:[]};
    ex.report = base; ex.err = ''; ex.step = 'report'; exRender();
    if(!s){
      storageAPI.get(draftKey('report'), false).then(function(res){
        if(res && res.value && ex.step==='report'){ ex.report = JSON.parse(res.value); exRender(); }
      }).catch(function(){});
    }
  }
  // 교사 확인이 끝난 보고서: 수정은 막고 읽기만 가능하게 연다.
  function exViewReport(){
    var s = srvReport(); if(!s){ return; }
    ex.report = {motive:s.motive||'', content:s.content||'', reflection:s.reflection||'',
      photos:(s.photoIds||[]).map(function(id){ return {id:id}; }), absentMembers:s.absentMembers||[]};
    ex.reportView = true; ex.err = ''; ex.step = 'report'; exRender();
  }
  function exSaveDraft(kind){
    var obj = kind==='report' ? ex.report : ex.log;
    storageAPI.set(draftKey(kind), JSON.stringify(obj), false).then(function(){
      showToast('이 기기에 임시 저장했어요. (제출 전까지 서버에는 올라가지 않아요)', 'success');
    }).catch(function(){
      // 용량 초과 시 사진을 빼고 글만 저장
      var lite = JSON.parse(JSON.stringify(obj, function(k,v){ return k==='data' ? undefined : v; }));
      storageAPI.set(draftKey(kind), JSON.stringify(lite), false).then(function(){
        showToast('사진 용량이 커서 글만 임시 저장했어요.', 'error');
      }).catch(function(){});
    });
  }
  function photoPayload(photos){
    return {
      keepPhotoIds: photos.filter(function(p){ return p.id; }).map(function(p){ return p.id; }),
      newPhotos: photos.filter(function(p){ return p.data; }).map(function(p){ return {name:p.name||'', data:p.data}; })
    };
  }
  function payloadSize(photos){
    return photos.reduce(function(n,p){ return n + (p.data ? p.data.length : 0); }, 0);
  }
  function basePayload(action, kind){
    var isReport = kind==='report';
    return { action:action, planId:ex.plan.id, title:ex.plan.title, mode:isReport ? 'team' : ex.mode, unitKey:isReport ? 'team' : ex.unitKey,
      submitterId:currentUser.id, submitterName:currentUser.name||currentUser.id, members:isReport ? ex.reportMembers : ex.members };
  }

  function exSubmitReport(){
    var r = ex.report, p = null;
    var absR = (r.absentMembers||[]).filter(function(a){ return ex.reportMembers.some(function(m){ return pkey(m)===pkey(a); }); });
    if(absR.some(function(a){ return !(a.reason||'').trim(); })) p = '활동 안 함으로 표시한 학생의 사유를 적어주세요.';
    else if(absR.length && absR.length >= ex.reportMembers.length) p = '모든 학생이 활동 안 함이면 보고서를 제출할 수 없어요.';
    else if(!r.motive.trim()) p = '봉사에 참여하게 된 동기를 입력해주세요.';
    else if(!r.content.trim()) p = '봉사한 내용을 입력해주세요.';
    else if(!r.reflection.trim()) p = '봉사에 참여한 소감을 입력해주세요.';
    else if(!(r.photos||[]).length) p = '보고서에는 사진을 1장 이상 올려주세요.';
    else if(payloadSize(r.photos) > 20*1024*1024) p = '사진 용량이 너무 커요. 사진 수를 줄여주세요.';
    if(p){ ex.err = p; exRender(); showToast(p, 'error'); return; }
    var payload = basePayload('report_submit', 'report');
    payload.absentMembers = absR.map(function(a){ return {sid:a.sid, name:a.name, reason:a.reason.trim()}; });
    payload.motive = r.motive.trim(); payload.content = r.content.trim(); payload.reflection = r.reflection.trim();
    var pp = photoPayload(r.photos); payload.keepPhotoIds = pp.keepPhotoIds; payload.newPhotos = pp.newPhotos;
    var startTs = Date.now() - 60000;
    ex.busy = true; ex.err = ''; exRender();
    exPost(payload).then(function(){
      return exVerify(function(){ var s = srvReport(); return s && new Date(s.submittedAt).getTime() >= startTs; });
    }).then(function(ok){
      storageAPI.delete(draftKey('report'), false).catch(function(){});
      ex.step = 'hub'; ex.busy = false; exRender();
      showToast(ok ? '보고서가 제출되었어요.' : '전송은 했지만 시트에서 아직 확인되지 않았어요. 잠시 후 다시 열어 확인해주세요.', ok ? 'success' : 'error');
    });
  }

  // 전송 결과는 응답을 읽을 수 없으므로, 서버에서 다시 읽어 실제로 반영됐는지 확인
  function exVerify(check){
    var tries = 0;
    function loop(){
      return wait(2200).then(function(){
        return fetch(SHEET_SYNC_URL_FIXED + '?exec=' + encodeURIComponent(ex.plan.id)).then(function(r){ return r.json(); });
      }).then(function(d){
        ex.server = {reports:d.reports||[], logs:d.logs||[]}; ex.serverFail = false;
        if(check()) return true;
        if(++tries >= 4) return false;
        return loop();
      }).catch(function(){ if(++tries >= 4) return false; return loop(); });
    }
    return loop();
  }

  // ---------- 4. 활동일지 ----------
  function exOpenLog(){
    if(!exSetUnit()){ exRender(); return; }
    var s = srvLog();
    var entries;
    if(s && s.entries && s.entries.length){
      entries = s.entries.map(function(en){
        return {no:en.no, date:en.date||'', place:en.place||DEFAULT_PLACE, participants:en.participants||[],
          content:en.content||'', reflection:en.reflection||'', photos:(en.photoIds||[]).map(function(id){ return {id:id}; }),
          confirmed:!!en.confirmed, confirmedBy:en.confirmedBy||'', confirmedAt:en.confirmedAt||''};
      });
    } else { entries = [1,2,3,4,5].map(blankEntry); }
    ex.log = {entries:entries, absent:!!(s&&s.absent), absentReason:(s&&s.absentReason)||'', absentMembers:((s&&s.absentMembers)||[]).filter(function(a){ return ex.members.some(function(m){ return pkey(m)===pkey(a); }); })}; ex.err = ''; ex.step = 'log'; exRender();
    if(!s){
      storageAPI.get(draftKey('log'), false).then(function(res){
        if(res && res.value && ex.step==='log'){ ex.log = JSON.parse(res.value); exRender(); }
      }).catch(function(){});
    }
  }
  // 봉사활동 기간: 이 범위 밖의 날짜는 일지에 입력할 수 없다.
  var LOG_DATE_MIN = '2026-09-07', LOG_DATE_MAX = '2026-11-13';
  function exSubmitLog(){
    if(ex.log.absent && ex.mode==='individual'){
      if(!(ex.log.absentReason||'').trim()){ ex.err = '활동하지 못한 사유를 적어주세요.'; exRender(); showToast(ex.err, 'error'); return; }
      var ap = basePayload('log_submit', 'log'); ap.entries = []; ap.absent = true; ap.absentReason = ex.log.absentReason.trim();
      var aTs = Date.now() - 60000;
      ex.busy = true; ex.err = ''; exRender();
      exPost(ap).then(function(){
        return exVerify(function(){ var s = srvLog(); return s && s.absent && new Date(s.submittedAt).getTime() >= aTs; });
      }).then(function(ok){
        storageAPI.delete(draftKey('log'), false).catch(function(){});
        ex.step = 'hub'; ex.busy = false; exRender();
        showToast(ok ? '"활동 안 함"으로 제출되었어요.' : '전송은 했지만 시트에서 아직 확인되지 않았어요. 잠시 후 다시 열어 확인해주세요.', ok ? 'success' : 'error');
      });
      return;
    }
    function isBlank(en){ return !en.confirmed && !en.date && !en.content.trim() && !en.reflection.trim() && !en.photos.length; }
    var ens = ex.log.entries.filter(function(en){ return !isBlank(en); }), p = null, total = 0;
    var absM = ex.mode==='team' ? (ex.log.absentMembers||[]).filter(function(a){ return ex.members.some(function(m){ return pkey(m)===pkey(a); }); }) : [];
    if(absM.some(function(a){ return !(a.reason||'').trim(); })) p = '활동 안 함으로 표시한 팀원의 사유를 적어주세요.';
    else if(absM.length && absM.length >= ex.members.length) p = '팀원 모두가 활동 안 함이면 각자 개인 일지에서 "활동 안 함"으로 제출해주세요.';
    if(!p && !ens.length){ p = '작성한 차시가 없어요. 최소 1개 차시의 내용을 입력해주세요.'; }
    for(var i=0;i<ens.length && !p;i++){
      var en = ens[i]; if(en.confirmed) continue;
      var tag = '('+en.no+')차시: ';
      if(!en.date) p = tag+'봉사일시를 선택해주세요.';
      else if(en.date < LOG_DATE_MIN || en.date > LOG_DATE_MAX) p = tag+'봉사일시는 2026년 9월 7일부터 11월 13일 사이에서만 선택할 수 있어요.';
      else if(!en.participants.length) p = tag+'참여자를 1명 이상 선택해주세요.';
      else if(!en.content.trim()) p = tag+'봉사활동 내용을 입력해주세요.';
      else if(!en.reflection.trim()) p = tag+'활동 소감을 입력해주세요.';
      total += payloadSize(en.photos);
    }
    if(!p && total > 20*1024*1024) p = '사진 용량이 너무 커요. 사진 수를 줄여주세요.';
    if(p){ ex.err = p; exRender(); showToast(p, 'error'); return; }
    var payload = basePayload('log_submit', 'log');
    payload.absentMembers = absM.map(function(a){ return {sid:a.sid, name:a.name, reason:a.reason.trim()}; });
    payload.entries = ens.map(function(en){
      var pp = photoPayload(en.photos);
      return {no:en.no, date:en.date, place:(en.place||DEFAULT_PLACE).trim(), participants:en.participants,
        content:en.content.trim(), reflection:en.reflection.trim(), keepPhotoIds:pp.keepPhotoIds, newPhotos:pp.newPhotos};
    });
    var startTs = Date.now() - 60000;
    ex.busy = true; ex.err = ''; exRender();
    exPost(payload).then(function(){
      return exVerify(function(){ var s = srvLog(); return s && new Date(s.submittedAt).getTime() >= startTs; });
    }).then(function(ok){
      storageAPI.delete(draftKey('log'), false).catch(function(){});
      ex.step = 'hub'; ex.busy = false; exRender();
      showToast(ok ? '활동일지가 제출되었어요. 교사 확인을 기다려주세요.' : '전송은 했지만 시트에서 아직 확인되지 않았어요. 잠시 후 다시 열어 확인해주세요.', ok ? 'success' : 'error');
    });
  }

  // ---------- 5. 교사 확인 ----------
  function exConfirm(nos){
    var key = ex.detailKey;
    var startNos = nos.slice();
    exPost({action:'log_confirm', planId:ex.plan.id, unitKey:key, nos:nos, confirmer:currentUser.id}).then(function(){
      ex.busy = true; exRender();
      return exVerify(function(){
        var l = (ex.server.logs||[]).filter(function(x){ return x.unitKey===key; })[0];
        return l && startNos.every(function(n){
          return (l.entries||[]).some(function(en){ return en.no===n && en.confirmed; });
        });
      });
    }).then(function(ok){
      ex.busy = false; exRender();
      showToast(ok ? '교사 확인이 완료되었어요.' : '확인 처리가 시트에 반영되지 않았어요. Apps Script 업데이트·배포를 확인해주세요.', ok ? 'success' : 'error');
    });
  }

  // ---------- 사진 ----------
  function compressImage(file){
    if(window.__testCompress) return window.__testCompress(file);
    return new Promise(function(resolve){
      var fr = new FileReader();
      fr.onload = function(){
        var img = new Image();
        img.onload = function(){
          var max = 1280, w = img.width, h = img.height;
          if(w > max || h > max){ var k = max/Math.max(w,h); w = Math.round(w*k); h = Math.round(h*k); }
          var c = document.createElement('canvas'); c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(c.toDataURL('image/jpeg', 0.72));
        };
        img.onerror = function(){ resolve(null); };
        img.src = fr.result;
      };
      fr.onerror = function(){ resolve(null); };
      fr.readAsDataURL(file);
    });
  }
  function exAddPhotos(files, target, scope){
    var max = maxPhotos(scope);
    var room = max - target.length;
    var list = Array.prototype.slice.call(files, 0, Math.max(room, 0));
    if(files.length > room) showToast(scope==='report' ? '보고서 사진은 최대 4장까지 올릴 수 있어요.' : '활동일지 사진은 차시마다 1장만 올릴 수 있어요.', 'error');
    Promise.all(list.map(compressImage)).then(function(arr){
      var bad = 0;
      arr.forEach(function(d,i){ if(d) target.push({data:d, name:list[i].name}); else bad++; });
      if(bad) showToast('읽을 수 없는 사진이 '+bad+'장 있어서 제외했어요.', 'error');
      exRender();
    });
  }
  function exHydratePhotos(){
    execMain.querySelectorAll('img[data-pid]').forEach(function(img){
      var id = img.getAttribute('data-pid');
      if(photoCache[id]){ img.src = photoCache[id]; return; }
      if(photoCache[id] === null) return;
      fetch(SHEET_SYNC_URL_FIXED + '?photo=' + encodeURIComponent(id)).then(function(r){ return r.json(); }).then(function(d){
        photoCache[id] = d && d.data ? d.data : null;
        execMain.querySelectorAll('img[data-pid="'+id+'"]').forEach(function(el){ if(photoCache[id]) el.src = photoCache[id]; });
      }).catch(function(){});
    });
  }
  function photoGrid(photos, scope, editable){
    var h = '<div class="ex-photos">';
    photos.forEach(function(p,pi){
      h += '<div class="ex-ph">' + (p.data ? '<img src="'+p.data+'" alt="">' : '<img data-pid="'+esc(p.id)+'" alt="">');
      if(editable) h += '<button type="button" class="ex-ph-x" data-act="delPhoto" data-scope="'+scope+'" data-pi="'+pi+'" title="삭제">&times;</button>';
      h += '</div>';
    });
    if(editable && photos.length < maxPhotos(scope)){
      h += '<label class="ex-add-photo">+ 사진 추가<input type="file" accept="image/*" multiple style="display:none;" data-file="'+scope+'"></label>';
    }
    if(!photos.length && !editable) h += '<span class="ex-note">사진 없음</span>';
    return h + '</div>';
  }
  function photosOf(scope){
    return scope==='report' ? ex.report.photos : ex.log.entries[+scope.slice(1)].photos;
  }

  // ---------- 화면 그리기 ----------
  function crumb(cur){
    var steps = [['pick','① 계획서 선택'],['hub','② 보고서 · 활동일지']];
    var idx = {pick:0, hub:1, report:1, log:1}[cur];
    return '<div class="ex-crumb">' + steps.map(function(s,i){
      return '<span class="'+(i===idx?'on':(i<idx?'done':''))+'">'+s[1]+'</span>';
    }).join('') + '</div>';
  }
  function membersTable(members){
    var h = '<table class="ex-tbl"><tr><th>학번</th><th>이름</th><th>학번</th><th>이름</th></tr>';
    for(var i=0;i<members.length;i+=2){
      var a = members[i], b = members[i+1];
      h += '<tr><td>'+esc(a.sid)+'</td><td>'+esc(a.name)+'</td><td>'+(b?esc(b.sid):'')+'</td><td>'+(b?esc(b.name):'')+'</td></tr>';
    }
    return h + '</table>';
  }

  function exRender(){
    if(!execActive || !ex) return;
    var h = '<div class="ex-wrap"><div class="ex-eyebrow">교육과정 이외 봉사활동 · 활동 완료 후</div><div class="ex-title">봉사활동 실행 보고</div>';
    if(ex.busy){ h += '<div class="ex-card"><div class="ex-note">처리 중입니다… 사진이 많으면 몇 초 걸릴 수 있어요.</div></div></div>'; execMain.innerHTML = h; return; }
    var teacher = currentUser && currentUser.role==='teacher';

  function planStudentsTable(studs, exc){
    var COLS = 3;
    var active = studs.filter(function(s){ return (s.sid||'').trim() || (s.name||'').trim(); });
    active.sort(function(a,b){
      var na = parseInt(a.sid,10), nb = parseInt(b.sid,10);
      if(isNaN(na) && isNaN(nb)) return String(a.sid).localeCompare(String(b.sid));
      if(isNaN(na)) return 1; if(isNaN(nb)) return -1; return na - nb;
    });
    var rowsPerCol = Math.max(1, Math.ceil(active.length / COLS)), blockW = 100 / COLS;
    var html = '<table class="students-tbl"><colgroup>';
    for(var cg=0;cg<COLS;cg++) html += '<col style="width:'+(blockW*0.16)+'%;"><col style="width:'+(blockW*0.30)+'%;"><col style="width:'+(blockW*0.48)+'%;">';
    html += '</colgroup><thead><tr>';
    for(var c=0;c<COLS;c++) html += '<th>순</th><th>학번</th><th>성명</th>';
    html += '</tr></thead><tbody>';
    for(var r=0;r<rowsPerCol;r++){
      html += '<tr>';
      for(var c2=0;c2<COLS;c2++){
        var pos = r + rowsPerCol*c2;
        if(pos < active.length){ var a = active[pos], isEx = exc.hasOwnProperty(a.sid);
          html += '<td class="idx">'+(pos+1)+'</td><td'+(isEx?' style="color:#999;text-decoration:line-through;"':'')+'>'+esc(a.sid)+'</td><td'+(isEx?' style="color:#999;text-decoration:line-through;"':'')+'>'+esc(a.name)+'</td>';
        } else html += '<td class="idx"></td><td></td><td></td>';
      }
      html += '</tr>';
    }
    html += '<tr class="total-row"><td colspan="'+(COLS*3-2)+'"></td><td class="total-label">총</td><td class="total-value">'+active.length+'명</td></tr></tbody></table>';
    return html;
  }

    html += '<tr><td class="rowno" rowspan="2">'+(n++)+'</td><td class="rowlabel">봉사활동 영역</td><td class="rowval fixed-text">'
      + ['이웃돕기활동','환경보호활동','캠페인활동'].map(function(a){ return esc(a)+'( '+(r.area===a ? '✓' : '&nbsp;')+' )'; }).join(', &nbsp;') + '</td></tr>';

    html += '<tr><td class="rowno">'+(n++)+'</td><td class="rowlabel">봉사활동 내용<br><span style="font-weight:400;font-size:10.5px;color:#888;">(50자 이내로 기재)</span></td><td class="rowval fixed-text">'+esc(r.content||'')+'</td></tr>';

    if(r.submitterName) html += '<div class="sheet-note" style="margin-top:14px; text-align:right;">작성자: '+esc(r.submitterName)+'</div>';

  }
  function exPickHtml(teacher){

    h += '<div class="ex-card"><h3>'+(teacher ? '확인할 계획서 찾기' : '실행 보고를 할 계획서 선택')+'</h3>';

      ? '지도교사 이름, 봉사활동명, 학생 이름으로 검색하세요. (학생 주도 프로젝트형만 표시)'

      });

  }

  function pdfEsc(s){ return esc(s==null?'':String(s)); }
  function pdfFmt(iso){
    var d = new Date(iso); if(!iso || isNaN(d)) return '';
    return d.getFullYear()+'.'+(d.getMonth()+1)+'.'+d.getDate()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
  }
  // 긴 글은 문단 → 문장 순서로 잘라 쪽 사이에서 자연스럽게 이어지도록 한다.
  function pdfChunks(text){
    var out = [];
    String(text||'').split('\n').forEach(function(par){
      if(par.length <= 380){ out.push(par); return; }
      var sents = par.match(/[^.!?。]+[.!?。]*\s*/g) || [par], cur = '';
      sents.forEach(function(st){
        if(cur && (cur+st).length > 380){ out.push(cur); cur = ''; }
        while(st.length > 380){ out.push(st.slice(0,380)); st = st.slice(380); }
        cur += st;
      });
      if(cur) out.push(cur);
    });
    return out.length ? out : [''];
  }
  function pdfTextBlocks(label, text){
    var ch = pdfChunks(text), blocks = [];
    ch.forEach(function(c, i){
      var tx = '<div class="tx'+(c.trim()?'':' empty')+'">'+(c.trim() ? pdfEsc(c) : (i===0 && ch.length===1 ? '(내용 없음)' : '&nbsp;'))+'</div>';
      blocks.push('<div class="pb" style="margin-bottom:'+(i<ch.length-1?'0':'9px')+';">'+(i===0 ? '<div class="lb">'+pdfEsc(label)+'</div>' : '')+tx+'</div>');
    });
    return blocks;
  }
  function pdfPhotoBlocks(ids){
    var blocks = [], list = ids||[];
    for(var i=0;i<list.length;i+=2){
      var row = '<div class="pb"><div class="phr">';
      [list[i], list[i+1]].forEach(function(id){
        if(id===undefined){ row += '<div class="ph" style="border:none;background:none;"></div>'; return; }
        var d = photoCache[id];
        row += '<div class="ph'+(d?'':' none')+'">'+(d ? '<img src="'+d+'" alt="">' : '(사진을 불러오지 못했어요)')+'</div>';
      });
      blocks.push(row+'</div></div>');
    }
    return blocks;
  }
  function pdfMeta(rows){
    return '<table class="meta"><tbody>'+rows.map(function(r){ return '<tr><th>'+pdfEsc(r[0])+'</th><td>'+r[1]+'</td></tr>'; }).join('')+'</tbody></table>';
  }
  function pdfAbsentText(arr){
    return (arr||[]).map(function(a){ return pdfEsc((a.sid?a.sid+' ':'')+a.name)+' (사유: '+pdfEsc(a.reason||'')+')'; }).join('<br>');
  }
  // 문서 하나 → 블록 목록 [{html, label}]
  function pdfDocBlocks(d){
    var b = [], o = d.obj;
    if(d.kind==='r'){
      var meta = [['봉사활동명', pdfEsc(ex.plan.title)], ['지도교사', pdfEsc(ex.plan.teacher)], ['작성자', pdfEsc(o.submitterName)+(o.submitterId?' ('+pdfEsc(o.submitterId)+')':'')], ['제출일시', pdfEsc(pdfFmt(o.submittedAt))], ['참여학생', pdfEsc(o.students||'')]];
      if((o.absentMembers||[]).length) meta.push(['활동 안 함', pdfAbsentText(o.absentMembers)]);
      b.push('<div class="pb"><h1>학생 주도 프로젝트형 봉사활동 보고서</h1>'+pdfMeta(meta)+'</div>');
      b = b.concat(pdfTextBlocks('봉사에 참여하게 된 동기', o.motive));
      b = b.concat(pdfTextBlocks('봉사한 내용', o.content));
      b = b.concat(pdfPhotoBlocks(o.photoIds));
      b = b.concat(pdfTextBlocks('봉사에 참여한 소감', o.reflection));
    } else {
      var m2 = [['봉사활동명', pdfEsc(ex.plan.title)], ['지도교사', pdfEsc(ex.plan.teacher)], ['제출자', pdfEsc(o.submitterName)+(o.submitterId?' ('+pdfEsc(o.submitterId)+')':'')+' · '+(o.mode==='team'?'팀 일지':'개인 일지')], ['참여학생', pdfEsc(o.students||'')]];
      if(!o.absent) m2.push(['상태', o.status==='확정' ? '교사 확인 완료' : '교사 확인 대기']);
      if((o.absentMembers||[]).length) m2.push(['활동 안 함', pdfAbsentText(o.absentMembers)]);
      b.push('<div class="pb"><h1>학생 주도 프로젝트형 봉사활동 활동일지</h1>'+pdfMeta(m2)+'</div>');
      if(o.absent){
        b.push('<div class="pb"><div class="lb">활동 안 함</div><div class="abs">이 학생은 이번 봉사활동에 참여하지 않았다고 제출했어요.<br>사유: '+pdfEsc(o.absentReason||'')+'</div></div>');
      } else {
        (o.entries||[]).forEach(function(en){
          var first = pdfTextBlocks('봉사활동 내용', en.content);
          var head = '<div class="ent"><span>('+pdfEsc(en.no)+') 차시</span><span>'+(en.confirmed ? '교사 확인 완료' : '교사 확인 대기')+'</span></div>'
            + '<div class="entmeta"><b>봉사일시</b> '+pdfEsc(en.date)+' &nbsp;|&nbsp; <b>봉사장소</b> '+pdfEsc(en.place)
            + '<br><b>참여자</b> '+(en.participants||[]).map(function(p){ return pdfEsc((p.sid||'')+' '+p.name); }).join(', ')+'</div>';
          first[0] = first[0].replace('<div class="lb">', head+'<div class="lb">'); // 차시 머리글은 내용 첫 문단과 한 덩어리로 붙인다
          b = b.concat(first);
          b = b.concat(pdfTextBlocks('활동 소감', en.reflection));
          b = b.concat(pdfPhotoBlocks(en.photoIds));
          if(en.confirmed) b.push('<div class="pb"><div class="cfm">✔ 교사 확인 · '+pdfEsc(en.confirmedBy)+' · '+pdfEsc(pdfFmt(en.confirmedAt))+'</div></div>');
        });
        if(!(o.entries||[]).length) b.push('<div class="pb"><div class="tx empty">(작성된 차시가 없어요)</div></div>');
      }
    }
    return b;
  }

  function pdfLoadPhotos(ids){
    var need = ids.filter(function(id){ return id && !photoCache[id]; });
    return Promise.all(need.map(function(id){
      return fetch(SHEET_SYNC_URL_FIXED + '?photo=' + encodeURIComponent(id)).then(function(r){ return r.json(); })
        .then(function(d){ if(d && d.data) photoCache[id] = d.data; }).catch(function(){});
    }));
  }
  function pdfWaitImages(root){
    return Promise.all([].slice.call(root.querySelectorAll('img')).map(function(img){
      return (img.decode ? img.decode() : Promise.resolve()).catch(function(){});
    }));
  }

  // docs: [{kind:'r'|'l', obj}]  → A4 PDF (문서마다 새 쪽에서 시작, 블록은 쪽 사이에서 잘리지 않음)
  function pdfMakeFile(docs, filename, setLabel){
    if(typeof html2canvas==='undefined' || !window.jspdf) return Promise.reject(new Error('lib'));
    var ids = [];
    docs.forEach(function(d){
      if(d.kind==='r') ids = ids.concat(d.obj.photoIds||[]);
      else (d.obj.entries||[]).forEach(function(en){ ids = ids.concat(en.photoIds||[]); });
    });
    var styleEl = document.createElement('style'); styleEl.textContent = LG_PDF_CSS; document.head.appendChild(styleEl);
    var meas = document.createElement('div'); meas.className = 'pdfm'; document.body.appendChild(meas);
    var stage = document.createElement('div'); stage.style.cssText = 'position:fixed; left:-10000px; top:0;'; document.body.appendChild(stage);
    function cleanup(){ [styleEl, meas, stage].forEach(function(n){ if(n.parentNode) n.parentNode.removeChild(n); }); }

    return pdfLoadPhotos(ids).then(function(){
      var CONTENT_H = 1123 - 70 - 62, pages = [];
      docs.forEach(function(d){
        var blocks = pdfDocBlocks(d);
        meas.innerHTML = blocks.join('');
        var title = ex.plan.title + ' · ' + (d.kind==='r' ? '보고서' : '활동일지 ('+d.obj.submitterName+')');
        var cur = {title:title, html:''}, used = 0;
        pages.push(cur);
        [].slice.call(meas.children).forEach(function(n){
          var cs = getComputedStyle(n), h = n.getBoundingClientRect().height + (parseFloat(cs.marginBottom)||0) + (parseFloat(cs.marginTop)||0);
          if(used + h > CONTENT_H && used > 0){ cur = {title:title, html:''}; pages.push(cur); used = 0; }
          cur.html += n.outerHTML; used += h;
        });
      });
      return pages;
    }).then(function(pages){
      var jsPDF = window.jspdf.jsPDF, pdf = new jsPDF({unit:'mm', format:'a4'});
      var i = 0;
      function next(){
        if(i >= pages.length){ pdf.save(filename); cleanup(); return Promise.resolve(); }
        if(setLabel) setLabel((i+1)+'/'+pages.length+'쪽 만드는 중…');
        stage.innerHTML = '<div class="pdfp"><div class="pg-head"><span>'+pdfEsc(pages[i].title)+'</span><span>충남외국어고등학교</span></div><div class="pg-body">'+pages[i].html+'</div><div class="pg-foot">'+(i+1)+' / '+pages.length+'</div></div>';
        var pageEl = stage.firstChild;
        return pdfWaitImages(pageEl).then(function(){
          return html2canvas(pageEl, {scale:2, backgroundColor:'#ffffff', useCORS:true});
        }).then(function(canvas){
          if(i>0) pdf.addPage();
          pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 210, 297);
          i++; return next();
        });
      }
      return next();
    }).catch(function(e){ cleanup(); throw e; });
  }

  function pdfClick(btn, docs, fname){
    if(!docs.length){ showToast('저장할 보고서·활동일지가 없어요.', 'error'); return; }

    var safe = (ex.plan.title||'봉사활동').replace(/[\\/:*?"<>|]/g,'');
    pdfMakeFile(docs, safe + '_' + fname + '.pdf', function(t){ btn.textContent = t; })
      .then(function(){ showToast('PDF를 저장했어요.', 'success'); })
      .catch(function(){ showToast('PDF를 만들지 못했어요. 인터넷 연결을 확인하고 다시 시도해주세요.', 'error'); })

      + photoGrid(r.photos, 'report', true)
      + '<div class="ex-label">5. 봉사에 참여한 소감</div><textarea class="ex-ta" data-f="reflection">'+esc(r.reflection)+'</textarea>';
    if(ex.err) h += '<div class="ex-err">'+esc(ex.err)+'</div>';
    h += '<div class="ex-actions"><button class="ex-btn ghost" data-act="backHub">← 돌아가기</button><button class="ex-btn ghost" data-act="draftReport">임시 저장</button><button class="ex-btn mint" data-act="submitReport">보고서 제출</button></div></div>';
    return h;
  }

  function entryHtml(en, i, mode){
    var edit = mode==='edit' && !en.confirmed;
    var h = '<div class="ex-entry '+(en.confirmed?'confirmed':'')+'"><div class="ex-entry-head"><span><span class="ex-no">'+en.no+'차시</span> '
      + (en.confirmed ? '<span class="ex-chip ok">교사 확인 완료</span>' : '<span class="ex-chip wait">교사 확인 대기</span>') + '</span>';
    if(mode==='edit' && !en.confirmed && ex.log.entries.length > 1) h += '<button class="ex-btn danger" data-act="delEntry" data-i="'+i+'">이 차시 삭제</button>';
    h += '</div>';
    if(edit){
      h += '<div class="ex-grid2"><div><div class="ex-label" style="margin-top:0;">봉사일시 <span class="ex-note">(9/7 ~ 11/13)</span></div><input type="date" class="ex-input" data-ei="'+i+'" data-ef="date" min="'+LOG_DATE_MIN+'" max="'+LOG_DATE_MAX+'" value="'+esc(en.date)+'"></div>'
        + '<div><div class="ex-label" style="margin-top:0;">봉사장소</div><input class="ex-input" data-ei="'+i+'" data-ef="place" value="'+esc(en.place)+'"></div></div>'
        + '<div class="ex-label">참여자</div><div class="ex-members">'
        + ex.members.map(function(m,j){
            if(absentOf(m)) return '';
            var on = en.participants.some(function(p){ return pkey(p)===pkey(m); });
            return '<label><input type="checkbox" data-pt="'+i+'" data-pj="'+j+'" '+(on?'checked':'')+'> '+esc(m.sid)+' '+esc(m.name)+'</label>';
          }).join('') + '</div>'
        + '<div class="ex-label">봉사활동 내용</div><textarea class="ex-ta" data-ei="'+i+'" data-ef="content">'+esc(en.content)+'</textarea>'
        + '<div class="ex-label">활동 소감 및 사진 <span class="ex-note">(사진은 선택 · 차시마다 1장)</span></div><textarea class="ex-ta" data-ei="'+i+'" data-ef="reflection">'+esc(en.reflection)+'</textarea>'
        + photoGrid(en.photos, 'e'+i, true);
    } else {
      h += '<div class="ex-grid2"><div><div class="ex-label" style="margin-top:0;">봉사일시</div><div class="ex-ro">'+esc(en.date)+'</div></div>'
        + '<div><div class="ex-label" style="margin-top:0;">봉사장소</div><div class="ex-ro">'+esc(en.place)+'</div></div></div>'
        + '<div class="ex-label">참여자</div><div class="ex-ro">'+en.participants.map(function(p){ return esc((p.sid||'')+' '+p.name); }).join(', ')+'</div>'
        + '<div class="ex-label">봉사활동 내용</div><div class="ex-ro">'+esc(en.content)+'</div>'
        + '<div class="ex-label">활동 소감 및 사진</div><div class="ex-ro">'+esc(en.reflection)+'</div>'
        + photoGrid(en.photos, 'e'+i, false);
    }
    h += '<div class="ex-confirmbar"><span>' + (en.confirmed
        ? '✔ 교사 확인 · '+esc(en.confirmedBy)+' · '+fmtDate(en.confirmedAt)
        : '교사 확인 전') + '</span>';
    h += '</div></div>';
    return h;
  }

  function absentOf(m){ return ((ex.log&&ex.log.absentMembers)||[]).filter(function(a){ return pkey(a)===pkey(m); })[0] || null; }
  function teamAbsentHtml(){
    var h = '<div class="ex-absent'+(((ex.log.absentMembers||[]).length)?' on':'')+'"><b>활동 안 함 선택 (팀원 중 활동하지 못한 학생)</b>'
      + '<div class="ex-note">활동에 참여하지 못한 팀원은 체크하고 사유를 적어주세요. 체크한 학생은 아래 차시 참여자 목록에서 빠져요.</div><div style="margin-top:6px;">';
    ex.members.forEach(function(m,j){
      var a = absentOf(m);
      h += '<div style="margin:4px 0;"><label><input type="checkbox" data-am="'+j+'" '+(a?'checked':'')+'> '+esc(m.sid)+' '+esc(m.name)+' <span class="ex-note">활동 안 함</span></label>'
        + (a ? '<input class="ex-input" data-amr="'+j+'" placeholder="사유 (필수)" value="'+esc(a.reason||'')+'" style="margin-top:4px;">' : '') + '</div>';
    });
    return h + '</div></div>';
  }
  function exLogHtml(){
    var h = crumb('log') + '<div class="ex-card"><div class="ex-doc-title">학생 주도 프로젝트형 봉사활동 활동일지</div>'
      + '<div class="ex-label" style="margin-top:0;">봉사활동명</div><div class="ex-ro">'+esc(ex.plan.title)+'</div>';
    var locked = ex.log.entries.some(function(x){ return x.confirmed; });
    if(ex.mode==='individual' && !locked){
      h += '<div class="ex-absent'+(ex.log.absent?' on':'')+'"><label><input type="checkbox" data-absent="1" '+(ex.log.absent?'checked':'')+'> <b>이번 봉사활동에 참여하지 못했어요 (활동 안 함)</b></label>'
        + '<div class="ex-note">활동을 하지 않은 학생은 차시를 쓰지 않고 이것만 체크한 뒤 사유를 적어 제출하면 돼요.</div>'
        + (ex.log.absent ? '<div class="ex-label">활동하지 못한 사유</div><textarea class="ex-ta" id="exAbsReason" rows="2" placeholder="예) 일정이 맞지 않아 참여하지 못했어요.">'+esc(ex.log.absentReason||'')+'</textarea>' : '') + '</div>';
    } else if(ex.mode==='team' && !locked){
      h += teamAbsentHtml();
    }
    if(ex.log.absent && ex.mode==='individual' && !locked){
      if(ex.err) h += '<div class="ex-err">'+esc(ex.err)+'</div>';
      return h + '<div class="ex-actions"><button class="ex-btn ghost" data-act="backHub">← 돌아가기</button><button class="ex-btn mint" data-act="submitLog">활동 안 함 제출</button></div></div>';
    }
    var allDone = ex.log.entries.length && ex.log.entries.every(function(x){ return x.confirmed; });
    if(allDone){
      h += '<div class="ex-note" style="margin:12px 0;"><b style="color:#1F7A58;">모든 차시의 교사 확인이 끝나서 수정할 수 없어요. 읽기만 할 수 있어요.</b> 고칠 내용이 있으면 담당 선생님께 확인 취소를 요청해주세요.</div>';
      ex.log.entries.forEach(function(en,i){ h += entryHtml(en, i, 'view'); });
      return h + '<div class="ex-actions"><button class="ex-btn ghost" data-act="backHub">← 돌아가기</button><button class="ex-btn" data-act="pdfLog">📥 활동일지 PDF 저장</button></div></div>';
    }
    h += '<div class="ex-note" style="margin:12px 0;">기본 5차시가 준비되어 있어요. 진행한 차시만 작성하면 되고, 비워 둔 차시는 제출되지 않아요. 더 필요하면 아래에서 차시를 추가할 수 있어요.</div>';
    ex.log.entries.forEach(function(en,i){ h += entryHtml(en, i, 'edit'); });
    if(ex.err) h += '<div class="ex-err">'+esc(ex.err)+'</div>';
    h += '<div class="ex-actions"><button class="ex-btn ghost" data-act="addEntry">+ 차시 추가</button></div>'
      + '<div class="ex-actions"><button class="ex-btn ghost" data-act="backHub">← 돌아가기</button><button class="ex-btn ghost" data-act="draftLog">임시 저장</button><button class="ex-btn mint" data-act="submitLog">활동일지 제출</button></div></div>';
    return h;
  }

  // 교사용
  function unitKeys(){
    var keys = {}, out = [];
    (ex.server.reports||[]).concat(ex.server.logs||[]).forEach(function(x){ if(!keys[x.unitKey]){ keys[x.unitKey] = true; out.push(x.unitKey); } });
    return out;
  }
  function exTUnitsHtml(){
    var p = ex.plan;
    var h = '<div class="ex-card"><h3>'+esc(p.title)+'</h3><div class="ex-note">지도교사 '+esc(p.teacher)+' · 참여학생 '+p.students.length+'명</div></div>';
    if(ex.serverFail) h += '<div class="ex-warn">제출 내용을 서버에서 불러오지 못했어요. Apps Script 업데이트·배포 여부를 확인해주세요.</div>';
    var keys = ex.server ? unitKeys() : [];
    if(!keys.length && !ex.serverFail) h += '<div class="ex-note">아직 제출된 보고서·활동일지가 없어요.</div>';
    keys.forEach(function(k){
      var rep = (ex.server.reports||[]).filter(function(x){ return x.unitKey===k; })[0];
      var lg = (ex.server.logs||[]).filter(function(x){ return x.unitKey===k; })[0];
      var src = lg || rep;
      var who = src.mode==='team' ? ('팀 · '+esc(src.submitterName)+' 외') : esc(src.submitterName);
      var logChip = '<span class="ex-chip none">일지 없음</span>';
      if(lg){
        var done = lg.entries.filter(function(x){ return x.confirmed; }).length;
        logChip = lg.status==='확정' ? '<span class="ex-chip ok">일지 교사 확인 완료</span>' : '<span class="ex-chip wait">일지 확인 '+done+'/'+lg.entries.length+'</span>';
      }
      h += '<button class="ex-item" data-act="openUnit" data-k="'+esc(k)+'"><b>'+who+'</b>'
        + (rep ? '<span class="ex-chip ok">보고서 제출</span>' : '<span class="ex-chip none">보고서 없음</span>') + logChip
        + '<div class="sub">'+esc(src.students||'')+'</div></button>';
    });
    h += '<div class="ex-actions"><button class="ex-btn ghost" data-act="backPick">← 다른 계획서 선택</button></div>';
    return h;
  }
  function exTDetailHtml(){
    var k = ex.detailKey;
    var rep = (ex.server.reports||[]).filter(function(x){ return x.unitKey===k; })[0];
    var lg = (ex.server.logs||[]).filter(function(x){ return x.unitKey===k; })[0];
    var h = '<div class="ex-card"><h3>'+esc(ex.plan.title)+'</h3><div class="ex-note">제출자: '+esc((lg||rep).submitterName)+' ('+esc((lg||rep).submitterId)+') · '+((lg||rep).mode==='team'?'팀':'개인')+'</div></div>';
    h += '<div class="ex-card"><div class="ex-doc-title">학생 주도 프로젝트형 봉사활동 보고서</div>';
    if(rep){
      h += '<div class="ex-label">참여학생</div><div class="ex-ro">'+esc(rep.students)+'</div>'
        + '<div class="ex-label">봉사에 참여하게 된 동기</div><div class="ex-ro">'+esc(rep.motive)+'</div>'
        + '<div class="ex-label">봉사한 내용</div><div class="ex-ro">'+esc(rep.content)+'</div>'
        + photoGrid((rep.photoIds||[]).map(function(id){ return {id:id}; }), 'r', false)
        + '<div class="ex-label">봉사에 참여한 소감</div><div class="ex-ro">'+esc(rep.reflection)+'</div>';
    } else { h += '<div class="ex-note">보고서가 아직 제출되지 않았어요.</div>'; }
    h += '</div><div class="ex-card"><div class="ex-doc-title">학생 주도 프로젝트형 봉사활동 활동일지</div>';
    if(lg){
      var pending = lg.entries.filter(function(x){ return !x.confirmed; }).length;
      lg.entries.forEach(function(en,i){
        var e2 = {no:en.no, date:en.date, place:en.place, participants:en.participants||[], content:en.content, reflection:en.reflection,
          photos:(en.photoIds||[]).map(function(id){ return {id:id}; }), confirmed:!!en.confirmed, confirmedBy:en.confirmedBy, confirmedAt:en.confirmedAt};
        h += entryHtml(e2, i, 'teacher');
      });
      if(pending) h += '<div class="ex-actions"><button class="ex-btn mint" data-act="confirmAll">활동일지 확인 (전체 '+lg.entries.length+'개 차시)</button></div>';
      else h += '<div class="ex-note">모든 차시의 교사 확인이 끝났어요.</div>';
    } else { h += '<div class="ex-note">활동일지가 아직 제출되지 않았어요.</div>'; }
    h += '</div><div class="ex-actions"><button class="ex-btn ghost" data-act="backUnits">← 제출 목록</button></div>';
    return h;
  }

  // ---------- 이벤트 (위임) ----------
  execMain.addEventListener('click', function(e){
    if(!ex) return;
    var img = e.target.closest && e.target.closest('.ex-ph img');
    if(img && img.src){
      var lb = document.createElement('div'); lb.className = 'ex-lightbox'; lb.innerHTML = '<img src="'+img.src+'" alt="">';
      lb.onclick = function(){ lb.remove(); }; document.body.appendChild(lb); return;
    }
    var t = e.target.closest('[data-act]'); if(!t) return;
    var act = t.getAttribute('data-act'), i = +t.getAttribute('data-i');
    if(act==='menuReport'){ ex.step = 'pick'; exRender(); if(!ex.results) exSearch(currentUser.name); }
    else if(act==='menuPlans'){ ex.step = 'plans'; exRender(); if(!ex.plans) exSearchPlans(); }
    else if(act==='goHome'){ ex.step = 'home'; exRender(); }
    else if(act==='viewPlan'){ ex.planView = ex.plans[i]; ex.step = 'plandetail'; exRender(); }
    else if(act==='backPlans'){ ex.step = 'plans'; exRender(); }
    else if(act==='reportFromPlan'){ var pv = ex.planView; ex.step = 'pick'; exPick({id:pv.id, title:pv.title, teacher:pv.teacher, students:parseStudents(pv.students), submitter:pv.submitterName}); }
    else if(act==='search') exSearch(document.getElementById('exQ').value);
    else if(act==='pick') exPick(ex.results[i]);
    else if(act==='backPick'){ ex.step = 'pick'; ex.plan = null; ex.err = ''; exRender(); }
    else if(act==='backHub'){ ex.step = 'hub'; ex.err = ''; exRender(); }
    else if(act==='openReport') exOpenReport();
    else if(act==='viewReport') exViewReport();
    else if(act==='openLog') exOpenLog();
    else if(act==='pdfReport'){ var pr = srvReport(); if(pr) pdfClick(t, [{kind:'r', obj:pr}], '보고서'); }
    else if(act==='pdfLog'){ var pl = srvLog(); if(pl) pdfClick(t, [{kind:'l', obj:pl}], '활동일지_'+(pl.submitterName||'')); }
    else if(act==='draftReport') exSaveDraft('report');
    else if(act==='draftLog') exSaveDraft('log');
    else if(act==='submitReport') exSubmitReport();
    else if(act==='submitLog') exSubmitLog();
    else if(act==='addEntry'){
      var max = ex.log.entries.reduce(function(m,x){ return Math.max(m, x.no); }, 0);
      ex.log.entries.push(blankEntry(max+1)); exRender();
    }
    else if(act==='delEntry'){
      if(!confirm('이 차시를 삭제할까요? 올려둔 사진도 함께 지워집니다.')) return;
      ex.log.entries.splice(i, 1); exRender();
    }
    else if(act==='delPhoto'){ photosOf(t.getAttribute('data-scope')).splice(+t.getAttribute('data-pi'), 1); exRender(); }
    else if(act==='openUnit'){ ex.detailKey = t.getAttribute('data-k'); ex.step = 'tdetail'; exRender(); }
    else if(act==='backUnits'){ ex.step = 'tunits'; exRender(); }
    else if(act==='confirmAll'){
      var lg = ex.server.logs.filter(function(x){ return x.unitKey===ex.detailKey; })[0];
      var nos = lg.entries.filter(function(x){ return !x.confirmed; }).map(function(x){ return x.no; });
      if(!confirm('이 활동일지('+lg.entries.length+'개 차시)를 확인 처리할까요?\n확인하면 학생이 수정할 수 없습니다.')) return;
      exConfirm(nos);
    }
  });
  execMain.addEventListener('input', function(e){
    if(!ex) return;
    var t = e.target;
    if(t.getAttribute('data-f') && ex.report) ex.report[t.getAttribute('data-f')] = t.value;
    else if(t.getAttribute('data-ef') && ex.log) ex.log.entries[+t.getAttribute('data-ei')][t.getAttribute('data-ef')] = t.value;
    else if(t.id==='exQ') ex.q = t.value;
    else if(t.id==='exAbsReason' && ex.log) ex.log.absentReason = t.value;
    else if(t.getAttribute('data-ramr') !== null && ex.report){
      var rrm = ex.reportMembers[+t.getAttribute('data-ramr')], rrec = repAbsentOf(rrm); if(rrec) rrec.reason = t.value;
    }
    else if(t.getAttribute('data-amr') !== null && ex.log){
      var amm = ex.members[+t.getAttribute('data-amr')], rec = absentOf(amm); if(rec) rec.reason = t.value;
    }
  });
  execMain.addEventListener('keydown', function(e){
    if(e.target.id==='exQ' && e.key==='Enter'){ exSearch(e.target.value); }
  });
  execMain.addEventListener('change', function(e){
    if(!ex) return;
    var t = e.target;
    if(t.getAttribute('data-ram') !== null){
      var rm = ex.reportMembers[+t.getAttribute('data-ram')]; ex.report.absentMembers = (ex.report.absentMembers||[]).filter(function(a){ return pkey(a)!==pkey(rm); });
      if(t.checked) ex.report.absentMembers.push({sid:rm.sid, name:rm.name, reason:''});
      exRender();
    }
    else if(t.getAttribute('data-am') !== null){
      var am = ex.members[+t.getAttribute('data-am')]; ex.log.absentMembers = ex.log.absentMembers||[];
      ex.log.absentMembers = ex.log.absentMembers.filter(function(a){ return pkey(a)!==pkey(am); });
      ex.log.entries.forEach(function(en){
        if(en.confirmed) return;
        en.participants = en.participants.filter(function(p){ return pkey(p)!==pkey(am); });
        if(!t.checked) en.participants.push(am);
      });
      if(t.checked) ex.log.absentMembers.push({sid:am.sid, name:am.name, reason:''});
      exRender();
    }
    else if(t.getAttribute('data-absent')){ ex.log.absent = t.checked; exRender(); }
    else if(t.getAttribute('data-mode')){ ex.mode = t.getAttribute('data-mode'); exSetUnit(); exRender(); }
    else if(t.getAttribute('data-tm') !== null){ ex.teamSel[+t.getAttribute('data-tm')] = t.checked; }
    else if(t.getAttribute('data-pt') !== null){
      var en = ex.log.entries[+t.getAttribute('data-pt')], m = ex.members[+t.getAttribute('data-pj')];
      en.participants = en.participants.filter(function(p){ return pkey(p)!==pkey(m); });
      if(t.checked) en.participants.push(m);
    }
    else if(t.getAttribute('data-file')){
      var scope = t.getAttribute('data-file');
      if(t.files && t.files.length) exAddPhotos(t.files, photosOf(scope), scope);
    }
  });



})();
</script></body></html>
